<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Card – Aritz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1244;--blue:#1a2fa8;
  --gold:#f5c842;--red:#cc2222;--green:#7cb836;
  --pixel:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:var(--green);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);
  font-family:var(--pixel);
  padding:20px;
}

/* ── CARD ── */
.card{
  width:100%;
  max-width:1200px;
  background:var(--blue);
  border:5px solid var(--gold);
  border-radius:12px;
  box-shadow:0 0 0 3px #000,12px 12px 0 rgba(0,0,0,.5);
  overflow:hidden;
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes cardIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ── HEADER ── */
.card-header{
  background:var(--navy);border-bottom:4px solid var(--gold);
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 28px;
}
.card-header .lbl{color:var(--gold);font-size:clamp(9px,1.4vw,16px);letter-spacing:2px}
.card-header .num{color:#8899ff;font-size:clamp(8px,1.1vw,13px)}

/* ── BODY ── */
.card-body{
  display:grid;
  grid-template-columns:clamp(200px,28%,340px) 1fr;
}

/* ── LEFT ── */
.left{
  background:linear-gradient(160deg,#1833bb,#0a1266);
  border-right:3px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 18px;gap:18px;
}
.avatar-frame{
  width:clamp(150px,20vw,260px);
  height:clamp(150px,20vw,260px);
  border:4px solid var(--gold);border-radius:8px;
  background:#0e1a77;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.avatar-frame img{width:100%;height:100%;object-fit:contain;object-position:center}
.avatar-frame svg{width:100%;height:100%}

.stats{width:100%}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:8px 4px;
  font-size:clamp(6px,1vw,11px);
}
.stat-row .k{color:#99aadd}
.stat-row .v{color:#fff}
.stat-row .v.gold{color:var(--gold)}

/* ── RIGHT ── */
.right{
  padding:22px 18px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.team-lbl{
  color:var(--gold);
  font-size:clamp(8px,1.2vw,14px);
  letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.team-lbl::before{content:'▶';color:#fff;font-size:clamp(6px,.9vw,10px)}

.team-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  flex:1;
}

/* ── SLOT ── */
.slot{
  background:#0a1d44;border:2px solid #1e44aa;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 8px 10px;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,background .15s;
}
.slot:hover{border-color:var(--gold);background:#142a66;transform:translateY(-6px)}

.slot img{
  width:clamp(80px,11vw,140px);
  height:clamp(80px,11vw,140px);
  object-fit:contain;
  image-rendering:pixelated;display:block;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
}
.slot .pname{
  color:#cce0ff;
  font-size:clamp(6px,.9vw,10px);
  text-align:center;margin-top:7px;letter-spacing:.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
}
.slot .plv{color:#88aadd;font-size:clamp(5px,.75vw,8px);margin-top:3px}

.types{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;justify-content:center}
.tb{
  font-size:clamp(5px,.7vw,8px);
  padding:3px 6px;border-radius:3px;color:#fff;
  text-transform:uppercase;letter-spacing:.3px;
}
.t-water{background:#3a7eee}.t-grass{background:#3da820}.t-ground{background:#b07a30}
.t-fire{background:#e85010}.t-ice{background:#3dbcbc}.t-electric{background:#c8a800}
.t-bug{background:#7a9a10}.t-rock{background:#887832}.t-ghost{background:#5c3a88}
.t-poison{background:#882288}.t-steel{background:#7a8fa0}.t-fairy{background:#cc5599}
.t-dark{background:#3a3a44}.t-flying{background:#6688cc}.t-fighting{background:#8a3010}
.t-psychic{background:#cc2255}.t-dragon{background:#4418d8}.t-normal{background:#7a7a66}

/* Tooltip */
.tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#05051a;color:#dde8ff;font-family:var(--vt);font-size:16px;
  padding:8px 12px;border-radius:4px;border:1px solid var(--gold);
  white-space:nowrap;z-index:99;pointer-events:none;
  opacity:0;transition:opacity .15s;text-align:center;line-height:1.6;
}
.slot:hover .tip{opacity:1}

/* ── FOOTER ── */
.card-footer{
  background:var(--navy);border-top:4px solid var(--gold);
  padding:12px 28px;
  display:flex;justify-content:space-between;align-items:center;
}
.card-footer .ftag{color:#8899ff;font-size:clamp(6px,.9vw,10px);letter-spacing:.5px}
.card-footer .fid{color:var(--gold);font-size:clamp(6px,.9vw,10px)}

/* ── RESPONSIVE móvil ── */
@media(max-width:620px){
  .card-body{grid-template-columns:1fr}
  .left{border-right:none;border-bottom:3px solid rgba(255,255,255,.12);flex-direction:row;flex-wrap:wrap;justify-content:center;gap:14px;padding:16px}
  .avatar-frame{width:120px;height:120px}
  .stats{min-width:180px;flex:1}
  .slot img{width:70px;height:70px}
}

/* ── MODAL POPUP ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  padding:20px;
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal{
  background:var(--navy);
  border:4px solid var(--gold);
  border-radius:10px;
  box-shadow:0 0 0 2px #000, 8px 8px 0 rgba(0,0,0,.6);
  width:100%;max-width:560px;
  overflow:hidden;
  transform:scale(.85) translateY(20px);
  transition:transform .2s;
}
.modal-overlay.open .modal{transform:none}

.modal-header{
  background:#060e33;
  border-bottom:3px solid var(--gold);
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
}
.modal-header .msprite{
  width:96px;height:96px;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));
}
.modal-header .minfo{flex:1}
.modal-header .mname{
  color:var(--gold);
  font-size:clamp(9px,1.6vw,14px);
  letter-spacing:1px;
  margin-bottom:8px;
}
.modal-header .mtypes{display:flex;gap:5px;flex-wrap:wrap}

.modal-close{
  background:var(--red);border:none;color:#fff;
  font-family:var(--pixel);font-size:9px;
  padding:8px 12px;border-radius:4px;cursor:pointer;
  flex-shrink:0;
  transition:background .15s;
}
.modal-close:hover{background:#ff3333}

.modal-body{padding:20px}

.modal-section{margin-bottom:16px}
.modal-section:last-child{margin-bottom:0}

.modal-section-title{
  color:#8899ff;
  font-size:clamp(6px,1vw,10px);
  letter-spacing:1px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.modal-section-title::before{content:'▶';color:var(--gold);font-size:7px}

.moves-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.move-pill{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:6px;
  padding:10px 12px;
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
}
.move-type-badge{
  font-size:7px;padding:3px 7px;border-radius:4px;
  color:#fff;text-transform:uppercase;letter-spacing:.5px;
  font-family:var(--pixel);
}
.move-name{
  color:#cce0ff;font-family:var(--vt);font-size:22px;
  letter-spacing:.5px;line-height:1;
}
.move-pp{
  color:var(--gold);font-family:var(--pixel);font-size:7px;
  letter-spacing:.5px;
}

.habil-box, .item-box{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:5px;
  padding:10px 14px;
  color:#fff;
  font-family:var(--vt);
  font-size:22px;
  display:flex;align-items:center;gap:8px;
}
.habil-box .icon, .item-box .icon{font-size:20px}
</style>
</head>
<body>
<div class="card">

  <div class="card-header">

        =====================================================

          </div>

            <div id="modal-hp-bar" style="height:100%;border-radius:4px;transition:width .4s,background .4s;"></div>

        </div>

        <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">

          <button onclick="dealDamage(25)"  style="background:#992222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">-25</button>
          <button onclick="dealDamage(50)"  style="background:#771111;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">-50</button>
          <button onclick="dealDamage(999)" style="background:#440000;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">KO</button>

    </div>
    <div class="modal-body">

  "Golpe Bajo":      "low-sweep",
  "Sombra Vil":      "shadow-sneak",

  "Taladradora":     "drill-run",

let TEAM = [
  {
    name:"SWAMPERT", types:["water","ground"], level:50, id:260,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/260.gif",

    moves:["Cascada","Puño Hielo","Terremoto","Relajo"],

    maxHp:160, hp:160,
  },
  {

    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/959.png",

    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/shiny/609.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/609.png",

    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/687.png",

    ability:"Respondón", item:"Restos",
    maxHp:130, hp:130,
  },
];

// ── CACHE de movimientos ya cargados ────────────────────
const MOVE_CACHE = {};

async function fetchMove(nameEs){
  if(MOVE_CACHE[nameEs]) return MOVE_CACHE[nameEs];
  const slug = MOVE_API[nameEs];
  if(!slug) return { pp:'?', type:'normal' };
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/move/${slug}`);
    const data = await res.json();
    const info = { pp: data.pp, type: data.type.name };
    MOVE_CACHE[nameEs] = info;
    return info;
  } catch {
    return { pp:'?', type:'normal' };
  }
}

// ── MODAL ────────────────────────────────────────────────
const overlay = document.getElementById('modal-overlay');
let currentModalPoke = null;

function updateModalHp(){
  const p = currentModalPoke;
  if(!p || !p.maxHp) return;
  const pct = Math.max(0, p.hp / p.maxHp * 100);
  document.getElementById('modal-hp-bar').style.width = pct + '%';
  document.getElementById('modal-hp-bar').style.background = hpColor(p);
  document.getElementById('modal-hp-text').textContent =
    p.hp <= 0 ? '¡DEBILITADO!' : `PS: ${p.hp} / ${p.maxHp}`;
}

function dealDamage(dmg){
  const p = currentModalPoke;
  if(!p || !p.maxHp) return;
  if(p.hp <= 0) return; // ya fainted
  p.hp = Math.max(0, p.hp - dmg);
  updateModalHp();
  refreshTeam();
}

// Heal a pokemon by a set amount (0 = full heal)
function healPoke(p, amount, revive=false){
  if(!p || !p.maxHp) return false;
  if(p.hp <= 0 && !revive) return false; // fainted, need revive
  if(p.hp >= p.maxHp) return false; // already full
  if(amount === 0) p.hp = p.maxHp;
  else p.hp = Math.min(p.maxHp, p.hp + amount);
  return true;
}

function revivePoke(p, halfHp=true){
  if(!p || !p.maxHp) return false;
  if(p.hp > 0) return false; // not fainted
  p.hp = halfHp ? Math.floor(p.maxHp / 2) : p.maxHp;
  return true;
}

async function openModal(p){
  currentModalPoke = p;
  document.getElementById('modal-sprite').src = p.src;
  document.getElementById('modal-name').textContent = `${p.name}  Nv.${p.level}`;
  document.getElementById('modal-types').innerHTML  = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  document.getElementById('modal-ability').textContent = p.ability || '—';
  document.getElementById('modal-item').textContent    = p.item || '—';
  updateModalHp();
  overlay.classList.add('open');

  const grid = document.getElementById('modal-moves');
  if(!p.moves || !p.moves.length){
    grid.innerHTML = '<span style="color:#555;font-size:6px;">Sin movimientos</span>';
    return;
  }
  grid.innerHTML = p.moves.map(m=>`
    <div class="move-pill" id="mp-${m.replace(/[\s']/g,'_')}">
      <div class="move-type-badge t-normal">···</div>
      <span class="move-name">${m}</span>
      <span class="move-pp">PP: …</span>
    </div>`).join('');

  await Promise.all(p.moves.map(async m => {
    const info = await fetchMove(m);
    const el   = document.getElementById(`mp-${m.replace(/[\s']/g,'_')}`);
    if(!el) return;
    el.querySelector('.move-type-badge').className = `move-type-badge t-${info.type}`;
    el.querySelector('.move-type-badge').textContent = info.type.toUpperCase();
    el.querySelector('.move-pp').textContent = `PP: ${info.pp}`;
  }));
}

// ── HP helpers ───────────────────────────────────────────
function hpColor(p){
  const pct = p.hp / p.maxHp;
  if(pct > .5) return '#44dd44';
  if(pct > .2) return '#f5c842';
  return '#cc2222';
}

// ── SLOTS ────────────────────────────────────────────────
function buildSlot(p){
  const fainted = p.hp <= 0;
  const div = document.createElement('div');
  div.className = 'slot' + (fainted ? ' fainted' : '');

  // Fainted overlay
  if(fainted){
    const fl = document.createElement('div');
    fl.className = 'fainted-label';
    fl.textContent = 'FIN';
    div.appendChild(fl);
  }

  const img = document.createElement('img');
  img.alt = p.name || '?';
  img.style.cssText = 'width:clamp(80px,11vw,140px);height:clamp(80px,11vw,140px);object-fit:contain;image-rendering:pixelated;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));';
  if(fainted) img.style.filter = 'grayscale(1) brightness(.55)';
  img.src = p.src || '';
  img.onerror = () => {
    img.onerror = null;
    img.src = p.fallback || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id||1}.png`;
  };
  div.appendChild(img);

  const nm = document.createElement('span');
  nm.className = 'pname';
  nm.textContent = p.name || '???';
  div.appendChild(nm);

  const lv = document.createElement('span');
  lv.className = 'plv';
  lv.textContent = `Nv.${p.level||50}`;
  div.appendChild(lv);

  const ty = document.createElement('div');
  ty.className = 'types';
  ty.innerHTML = (p.types||['normal']).map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  div.appendChild(ty);

  // HP bar (solo si tiene maxHp)
  if(p.maxHp){
    const pct = Math.max(0, p.hp / p.maxHp * 100);
    const wrap = document.createElement('div'); wrap.className='hp-bar-wrap';
    const bar  = document.createElement('div'); bar.className='hp-bar';
    bar.style.width = pct + '%';
    bar.style.background = hpColor(p);
    wrap.appendChild(bar);
    div.appendChild(wrap);
    const ht = document.createElement('span'); ht.className='hp-text';
    ht.textContent = fainted ? '¡DEBILITADO!' : `PS: ${p.hp}/${p.maxHp}`;
    div.appendChild(ht);
  }

  div.addEventListener('click', () => {
    if(swapMode) return;
    openModal(p);
  });
  return div;
}

// ── SWAP: seleccionar slot del equipo para intercambiar ──
let swapMode    = false;  // estamos seleccionando slot del equipo?
let pendingPC   = null;   // pokemon del PC a meter

function enterSwapMode(pcPoke){
  pendingPC = pcPoke;
  swapMode  = true;
  // Resaltar slots del equipo
  document.querySelectorAll('.slot').forEach((el,i) => {
    el.style.border = '3px solid #f5c842';
    el.style.boxShadow = '0 0 10px #f5c842';
    el.style.cursor = 'crosshair';
    el._origClick = el.onclick;
    el.onclick = (e) => { e.stopPropagation(); doSwap(i); };
  });
  document.getElementById('pc-info').innerHTML =
    `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
      <span style="color:#f5c842;font-size:5.5px;">⚡ Selecciona un Pokémon del equipo</span>
      <button onclick="cancelSwapMode()" style="background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:3px 7px;border-radius:3px;cursor:pointer;">CANCELAR</button>
    </div>`;
}

function cancelSwapMode(){
  swapMode = false; pendingPC = null;
  document.querySelectorAll('.slot').forEach(el => {
    el.style.border = '';
    el.style.boxShadow = '';
    el.style.cursor = '';
    el.onclick = null;
  });
  document.getElementById('pc-info').innerHTML =
    `<span style="color:#444;font-size:6px;">Haz click en un Pokémon para intercambiarlo con el equipo</span>`;
}

function doSwap(teamIdx){
  if(!pendingPC) return;
  const outPoke = TEAM[teamIdx];

  // Asegurar src/fallback en el que sale
  if(!outPoke.id){
    // Extraer id del src si no lo tiene
    const m = outPoke.src.match(/animated\/(?:shiny\/)?(\d+)\.gif/) || outPoke.fallback.match(/\/(\d+)\.png/);
    if(m) outPoke.id = parseInt(m[1]);
  }
  if(outPoke.id && !outPoke.src.includes('http')){
    outPoke.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${outPoke.id}.gif`;
    outPoke.fallback = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${outPoke.id}.png`;
  }

  // Intercambio
  TEAM[teamIdx] = pendingPC;
  const box = PC_BOXES[currentBox];
  const pcIdx = box.findIndex(p => p === pendingPC);
  if(pcIdx !== -1) box[pcIdx] = outPoke;

  swapMode = false; pendingPC = null;

  // Restaurar estilos de slots
  document.querySelectorAll('.slot').forEach(el => {
    el.style.border = '';
    el.style.boxShadow = '';
    el.style.cursor = '';
    el.onclick = null;
  });

  refreshTeam();
  renderPCBox();
  document.getElementById('pc-info').innerHTML =
    `<span style="color:#aaffaa;font-size:6px;">✔ ¡Intercambio realizado!</span>`;
}

function getSpriteUrl(p){ return p.src; }
function getFallbackUrl(p){ return p.fallback; }

function renderPCBox(){
  const grid = document.getElementById('pc-grid');
  grid.innerHTML = '';
  PC_BOXES[currentBox].forEach(p => {
    const slot = document.createElement('div');
    slot.style.cssText = `
      background:#0d1744;border:2px solid ${p.shiny ? '#ffdd55' : '#1e44aa'};border-radius:5px;
      display:flex;flex-direction:column;align-items:center;
      padding:6px 4px;cursor:pointer;position:relative;
      transition:border-color .15s,transform .15s;
    `;
    if(p.shiny){
      const badge = document.createElement('span');
      badge.textContent='✨';
      badge.style.cssText='position:absolute;top:2px;right:3px;font-size:9px;';
      slot.appendChild(badge);
    }
    slot.onmouseover = () => { slot.style.borderColor='#f5c842'; slot.style.transform='translateY(-3px)'; showPCInfo(p); };
    slot.onmouseout  = () => { slot.style.borderColor = p.shiny?'#ffdd55':'#1e44aa'; slot.style.transform=''; };
    // Click → entrar en modo swap
    slot.addEventListener('click', () => enterSwapMode(p));

    const img = document.createElement('img');
    img.src = getSpriteUrl(p);
    img.onerror = () => { img.onerror=null; img.src = getFallbackUrl(p); };
    img.style.cssText='width:64px;height:64px;object-fit:contain;image-rendering:pixelated;';

    const nm = document.createElement('span');
    nm.textContent = p.name;
    nm.style.cssText=`color:${p.shiny?'#ffdd55':'#aabbff'};font-size:4.5px;margin-top:3px;text-align:center;letter-spacing:.3px;`;

    slot.appendChild(img);
    slot.appendChild(nm);
    grid.appendChild(slot);
  });
  if(!swapMode)
    document.getElementById('pc-info').innerHTML = `<span style="color:#444;font-size:6px;">Haz click en un Pokémon para intercambiarlo con el equipo</span>`;
}

const PC_INFO_CACHE = {};
async function showPCInfo(p){
  if(swapMode) return; // no sobreescribir mensaje de swap
  const info = document.getElementById('pc-info');
  const id = p.id;
  if(PC_INFO_CACHE[id]){
    // Enriquecer con habilidad y movimientos
    info.innerHTML = PC_INFO_CACHE[id] +
      `<div style="color:#aaffaa;font-size:5.5px;margin-top:3px;">🔮 ${p.ability} &nbsp;|&nbsp; ${p.moves.join(' · ')}</div>`;
    return;
  }
  info.innerHTML = `<span style="color:#444;font-size:6px;">Cargando...</span>`;
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    const data = await res.json();
    const name = p.name;
    const types = data.types.map(t=>`<span style="font-size:5px;padding:2px 5px;border-radius:3px;color:#fff;background:${typeColor(t.type.name)};text-transform:uppercase;">${t.type.name}</span>`).join(' ');
    const hp  = data.stats.find(s=>s.stat.name==='hp')?.base_stat??'?';
    const atk = data.stats.find(s=>s.stat.name==='attack')?.base_stat??'?';
    const spd = data.stats.find(s=>s.stat.name==='speed')?.base_stat??'?';
    const base=`<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
      <span style="color:#f5c842;font-size:7px;">${name}${p.shiny?' ✨':''}</span>
      ${types}
      <span style="color:#aabfff;font-size:6px;">PS:${hp}</span>
      <span style="color:#ffaaaa;font-size:6px;">AT:${atk}</span>
      <span style="color:#aaffaa;font-size:6px;">VE:${spd}</span>
    </div>`;
    PC_INFO_CACHE[id]=base;
    info.innerHTML = base +
      `<div style="color:#aaffaa;font-size:5.5px;margin-top:3px;">🔮 ${p.ability} &nbsp;|&nbsp; ${p.moves.join(' · ')}</div>`;
  } catch { info.innerHTML=`<span style="color:#444;font-size:6px;">Error</span>`; }
}

function typeColor(t){
  const m={water:'#3a7eee',grass:'#3da820',ground:'#b07a30',fire:'#e85010',
    ice:'#3dbcbc',electric:'#c8a800',bug:'#7a9a10',rock:'#887832',ghost:'#5c3a88',
    poison:'#882288',steel:'#7a8fa0',fairy:'#cc5599',dark:'#3a3a44',
    flying:'#6688cc',fighting:'#8a3010',psychic:'#cc2255',dragon:'#4418d8',normal:'#7a7a66'};
  return m[t]||'#555';
}

    // heal: cantidad de PS restaurados. 0 = cura total. revive:true = revivir
    { name:"Poción",        img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/potion.png",          qty:999, heal:20   },
    { name:"Super Poción",  img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/super-potion.png",    qty:999, heal:50   },
    { name:"Hiper Poción",  img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/hyper-potion.png",    qty:999, heal:120  },
    { name:"Poción Máx.",   img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/max-potion.png",      qty:999, heal:0    },
    { name:"Cura Total",    img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/full-restore.png",    qty:999, heal:0    },
    { name:"Revivir",       img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/revive.png",          qty:999, revive:true, heal:0, halfHp:true },
    { name:"Max Revivir",   img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/max-revive.png",      qty:999, revive:true, heal:0, halfHp:false },
    { name:"Antídoto",      img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/antidote.png",        qty:999 },
    { name:"Paralyze Heal", img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/paralyze-heal.png",   qty:999 },
    { name:"Burn Heal",     img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/burn-heal.png",       qty:999 },
    { name:"Ice Heal",      img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ice-heal.png",        qty:999 },
    { name:"Full Heal",     img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/full-heal.png",       qty:999 },
  ],
};

let bagOpen = false;
let bagCat  = 0;
const BAG_CATS = Object.keys(BAG_ITEMS);

function buildBag(){
  const btn = document.createElement('button');
  btn.id = 'bag-btn';
  btn.innerHTML = `🎒 BOLSA`;
  btn.style.cssText = `
    position:fixed;bottom:24px;right:140px;z-index:200;
    background:#0d1244;border:3px solid #f5c842;border-radius:6px;
    color:#f5c842;font-family:'Press Start 2P',monospace;font-size:9px;
    padding:10px 16px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
    transition:background .15s;letter-spacing:1px;
  `;
  btn.onmouseover = () => btn.style.background='#1a2fa8';
  btn.onmouseout  = () => btn.style.background='#0d1244';
  btn.onclick = toggleBag;
  document.body.appendChild(btn);

  const win = document.createElement('div');
  win.id = 'bag-window';
  win.style.cssText = `
    position:fixed;bottom:76px;right:140px;z-index:199;
    width:360px;
    background:#0a0e2a;border:4px solid #f5c842;border-radius:8px;
    box-shadow:0 0 0 2px #000,6px 6px 0 rgba(0,0,0,.7);
    font-family:'Press Start 2P',monospace;
    display:none;overflow:hidden;
  `;
  win.innerHTML = `
    <div style="background:#060e33;border-bottom:3px solid #f5c842;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="color:#f5c842;font-size:8px;letter-spacing:1px;">🎒 BOLSA</span>
      <button onclick="toggleBag()" style="background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:7px;padding:4px 8px;border-radius:3px;cursor:pointer;">✕</button>
    </div>
    <div style="background:#080e28;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1a2a66;">
      <button onclick="changeBagCat(-1)" style="background:#1a2fa8;border:2px solid #f5c842;color:#f5c842;font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 9px;border-radius:3px;cursor:pointer;">◀</button>
      <span id="bag-cat-name" style="color:#f5c842;font-size:7px;letter-spacing:1px;">POKÉ BALLS</span>
      <button onclick="changeBagCat(1)" style="background:#1a2fa8;border:2px solid #f5c842;color:#f5c842;font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 9px;border-radius:3px;cursor:pointer;">▶</button>
    </div>
    <div id="bag-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;background:#0a0e2a;"></div>
    <div id="bag-info" style="border-top:2px solid #1a2a66;padding:8px 12px;min-height:38px;background:#080e28;"></div>
  `;
  document.body.appendChild(win);
  renderBag();
}

function toggleBag(){
  bagOpen = !bagOpen;
  document.getElementById('bag-window').style.display = bagOpen ? 'block' : 'none';
}

function changeBagCat(dir){
  bagCat = (bagCat + dir + BAG_CATS.length) % BAG_CATS.length;
  document.getElementById('bag-cat-name').textContent = BAG_CATS[bagCat];
  renderBag();
}

function renderBag(){
  const grid = document.getElementById('bag-grid');
  grid.innerHTML = '';
  const cat = BAG_CATS[bagCat];
  BAG_ITEMS[cat].forEach(item => {
    const slot = document.createElement('div');
    slot.style.cssText = `
      background:#0d1744;border:2px solid #1e44aa;border-radius:5px;
      display:flex;flex-direction:column;align-items:center;
      padding:8px 4px 6px;cursor:pointer;
      transition:border-color .15s,transform .15s;
    `;
    const canUse = item.heal !== undefined || item.revive;
    if(canUse) slot.style.borderColor = '#2266cc';

    slot.onmouseover = () => {
      slot.style.borderColor='#f5c842';
      slot.style.transform='translateY(-3px)';
      const desc = item.revive
        ? (item.halfHp ? 'Revive con PS/2' : 'Revive con PS máximos')
        : item.heal !== undefined
          ? (item.heal===0 ? 'Cura todos los PS' : `Cura ${item.heal} PS`)
          : 'Sin efecto de curación';
      document.getElementById('bag-info').innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;">
          <img src="${item.img}" style="width:24px;height:24px;image-rendering:pixelated;">
          <span style="color:#f5c842;font-size:7px;">${item.name}</span>
          <span style="color:#aabfff;font-size:6px;">∞</span>
          <span style="color:#aaffaa;font-size:5.5px;">${desc}</span>
        </div>`;
    };
    slot.onmouseout = () => {
      slot.style.borderColor = canUse ? '#2266cc' : '#1e44aa';
      slot.style.transform='';
      document.getElementById('bag-info').innerHTML = `<span style="color:#444;font-size:6px;">Haz click en una poción para usarla en un Pokémon</span>`;
    };

    // Click: mostrar selector de pokemon del equipo
    if(canUse){
      slot.addEventListener('click', () => showTeamPicker(item));
    }

    const img = document.createElement('img');
    img.src = item.img;
    img.style.cssText = 'width:48px;height:48px;object-fit:contain;image-rendering:pixelated;';
    const qty = document.createElement('span');
    qty.textContent = '∞';
    qty.style.cssText = 'color:#f5c842;font-size:5.5px;margin-top:4px;';
    const nm = document.createElement('span');
    nm.textContent = item.name;
    nm.style.cssText = 'color:#aabbff;font-size:4.5px;margin-top:2px;text-align:center;line-height:1.4;';
    slot.appendChild(img); slot.appendChild(qty); slot.appendChild(nm);
    grid.appendChild(slot);
  });
  document.getElementById('bag-info').innerHTML = `<span style="color:#444;font-size:6px;">Haz click en una poción para usarla en un Pokémon</span>`;
}

// Mostrar selector del equipo dentro del panel de la bolsa
function showTeamPicker(item){
  const grid = document.getElementById('bag-grid');
  grid.innerHTML = '';
  document.getElementById('bag-info').innerHTML =
    `<div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="color:#f5c842;font-size:5.5px;">¿A quién usar <strong>${item.name}</strong>?</span>
      <button onclick="renderBag()" style="background:#333;border:none;color:#aaa;font-family:'Press Start 2P',monospace;font-size:5px;padding:3px 6px;border-radius:3px;cursor:pointer;">CANCELAR</button>
    </div>`;

  TEAM.forEach((p,i) => {
    const fainted = p.hp <= 0;
    const canTarget = item.revive ? fainted : (!fainted && p.hp < p.maxHp);

    const slot = document.createElement('div');
    slot.style.cssText = `
      background:${canTarget ? '#0d1744' : '#0a0a1a'};
      border:2px solid ${canTarget ? '#2266cc' : '#222'};
      border-radius:5px;display:flex;flex-direction:column;align-items:center;
      padding:6px 4px;cursor:${canTarget?'pointer':'not-allowed'};
      opacity:${canTarget?1:.4};transition:border-color .15s,transform .15s;
    `;
    if(canTarget){
      slot.onmouseover = () => { slot.style.borderColor='#f5c842'; slot.style.transform='translateY(-2px)'; };
      slot.onmouseout  = () => { slot.style.borderColor='#2266cc'; slot.style.transform=''; };
      slot.addEventListener('click', () => {
        let ok = false;
        if(item.revive) ok = revivePoke(p, item.halfHp);
        else ok = healPoke(p, item.heal);
        if(ok){
          // Feedback
          document.getElementById('bag-info').innerHTML =
            `<span style="color:#aaffaa;font-size:6px;">✔ ${item.name} usado en ${p.name}! PS: ${p.hp}/${p.maxHp}</span>`;
          refreshTeam();
          // Si el modal está abierto con este pokemon, actualizar HP
          if(currentModalPoke === p) updateModalHp();
          setTimeout(renderBag, 1200);
        }
      });
    }

    const img = document.createElement('img');
    img.src = p.src;
    img.onerror = () => { img.onerror=null; img.src=p.fallback; };
    img.style.cssText = `width:48px;height:48px;object-fit:contain;image-rendering:pixelated;${fainted?'filter:grayscale(1) brightness(.5);':''}`;
    const nm = document.createElement('span');
    nm.textContent = p.name;
    nm.style.cssText = 'color:#aabbff;font-size:4px;margin-top:3px;text-align:center;';
    const hp = document.createElement('span');
    hp.textContent = fainted ? '¡FIN!' : `${p.hp}/${p.maxHp}`;
    hp.style.cssText = `color:${fainted?'#cc2222':'#f5c842'};font-size:4px;margin-top:1px;`;

    slot.appendChild(img); slot.appendChild(nm); slot.appendChild(hp);
    grid.appendChild(slot);
  });
}

// ── INIT ─────────────────────────────────────────────────
function initApp(){
  try {
    const grid = document.getElementById('team-grid');
    if(!grid){ console.error('team-grid not found'); return; }
    grid.innerHTML = '';
    TEAM.forEach((p,i) => {
      try { grid.appendChild(buildSlot(p)); }
      catch(e){ console.error('Error building slot',i,e); }
    });
    updateClock();
    setInterval(updateClock, 1000);
    buildPC();
    buildBag();
  } catch(e){ console.error('initApp error:', e); }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>

<style>
/* HP bar */
.hp-bar-wrap{
  width:90%;height:6px;background:#1a1a3a;
  border-radius:3px;margin-top:5px;overflow:hidden;
  border:1px solid rgba(255,255,255,.15);
}
.hp-bar{height:100%;border-radius:3px;transition:width .4s,background .4s}
.hp-text{color:#aac8ff;font-size:4px;margin-top:2px;letter-spacing:.3px}

.slot.fainted img{ filter:grayscale(1) brightness(.6) !important; }
.slot.fainted{ border-color:#444 !important; background:#0a0a1a !important; }
.slot.fainted .pname{ color:#666 !important; }
.slot.fainted .hp-text{ color:#cc2222 !important; }
/* fainted overlay */
.fainted-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.7);color:#cc2222;
  font-size:6px;padding:3px 6px;border-radius:3px;
  letter-spacing:1px;pointer-events:none;
  border:1px solid #cc2222;
}
</style>
