<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Card – Aritz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1244;--blue:#1a2fa8;
  --gold:#f5c842;--red:#cc2222;--green:#7cb836;
  --pixel:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:var(--green);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);
  font-family:var(--pixel);
  padding:20px;
}

/* ── CARD ── */
.card{
  width:100%;
  max-width:1200px;
  background:var(--blue);
  border:5px solid var(--gold);
  border-radius:12px;
  box-shadow:0 0 0 3px #000,12px 12px 0 rgba(0,0,0,.5);
  overflow:hidden;
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes cardIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ── HEADER ── */
.card-header{
  background:var(--navy);border-bottom:4px solid var(--gold);
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 28px;
}
.card-header .lbl{color:var(--gold);font-size:clamp(9px,1.4vw,16px);letter-spacing:2px}
.card-header .num{color:#8899ff;font-size:clamp(8px,1.1vw,13px)}

/* ── BODY ── */
.card-body{
  display:grid;
  grid-template-columns:clamp(200px,28%,340px) 1fr;
}

/* ── LEFT ── */
.left{
  background:linear-gradient(160deg,#1833bb,#0a1266);
  border-right:3px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 18px;gap:18px;
}
.avatar-frame{
  width:clamp(150px,20vw,260px);
  height:clamp(150px,20vw,260px);
  border:4px solid var(--gold);border-radius:8px;
  background:#0e1a77;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.avatar-frame img{width:100%;height:100%;object-fit:contain;object-position:center}
.avatar-frame svg{width:100%;height:100%}

.stats{width:100%}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:8px 4px;
  font-size:clamp(6px,1vw,11px);
}
.stat-row .k{color:#99aadd}
.stat-row .v{color:#fff}
.stat-row .v.gold{color:var(--gold)}

/* ── RIGHT ── */
.right{
  padding:22px 18px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.team-lbl{
  color:var(--gold);
  font-size:clamp(8px,1.2vw,14px);
  letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.team-lbl::before{content:'▶';color:#fff;font-size:clamp(6px,.9vw,10px)}

.team-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  flex:1;
}

/* ── SLOT ── */
.slot{
  background:#0a1d44;border:2px solid #1e44aa;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 8px 10px;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,background .15s;
}
.slot:hover{border-color:var(--gold);background:#142a66;transform:translateY(-6px)}

.slot img{
  width:clamp(80px,11vw,140px);
  height:clamp(80px,11vw,140px);
  object-fit:contain;
  image-rendering:pixelated;display:block;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
}
.slot .pname{
  color:#cce0ff;
  font-size:clamp(6px,.9vw,10px);
  text-align:center;margin-top:7px;letter-spacing:.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
}
.slot .plv{color:#88aadd;font-size:clamp(5px,.75vw,8px);margin-top:3px}

.types{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;justify-content:center}
.tb{
  font-size:clamp(5px,.7vw,8px);
  padding:3px 6px;border-radius:3px;color:#fff;
  text-transform:uppercase;letter-spacing:.3px;
}
.t-water{background:#3a7eee}.t-grass{background:#3da820}.t-ground{background:#b07a30}
.t-fire{background:#e85010}.t-ice{background:#3dbcbc}.t-electric{background:#c8a800}
.t-bug{background:#7a9a10}.t-rock{background:#887832}.t-ghost{background:#5c3a88}
.t-poison{background:#882288}.t-steel{background:#7a8fa0}.t-fairy{background:#cc5599}
.t-dark{background:#3a3a44}.t-flying{background:#6688cc}.t-fighting{background:#8a3010}
.t-psychic{background:#cc2255}.t-dragon{background:#4418d8}.t-normal{background:#7a7a66}

/* Tooltip */
.tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#05051a;color:#dde8ff;font-family:var(--vt);font-size:16px;
  padding:8px 12px;border-radius:4px;border:1px solid var(--gold);
  white-space:nowrap;z-index:99;pointer-events:none;
  opacity:0;transition:opacity .15s;text-align:center;line-height:1.6;
}
.slot:hover .tip{opacity:1}

/* ── FOOTER ── */
.card-footer{
  background:var(--navy);border-top:4px solid var(--gold);
  padding:12px 28px;
  display:flex;justify-content:space-between;align-items:center;
}
.card-footer .ftag{color:#8899ff;font-size:clamp(6px,.9vw,10px);letter-spacing:.5px}
.card-footer .fid{color:var(--gold);font-size:clamp(6px,.9vw,10px)}

/* ── RESPONSIVE móvil ── */
@media(max-width:620px){
  .card-body{grid-template-columns:1fr}
  .left{border-right:none;border-bottom:3px solid rgba(255,255,255,.12);flex-direction:row;flex-wrap:wrap;justify-content:center;gap:14px;padding:16px}
  .avatar-frame{width:120px;height:120px}
  .stats{min-width:180px;flex:1}
  .slot img{width:70px;height:70px}
}

/* ── MODAL POPUP ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  padding:20px;
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal{
  background:var(--navy);
  border:4px solid var(--gold);
  border-radius:10px;
  box-shadow:0 0 0 2px #000, 8px 8px 0 rgba(0,0,0,.6);
  width:100%;max-width:560px;
  overflow:hidden;
  transform:scale(.85) translateY(20px);
  transition:transform .2s;
}
.modal-overlay.open .modal{transform:none}

.modal-header{
  background:#060e33;
  border-bottom:3px solid var(--gold);
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
}
.modal-header .msprite{
  width:96px;height:96px;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));
}
.modal-header .minfo{flex:1}
.modal-header .mname{
  color:var(--gold);
  font-size:clamp(9px,1.6vw,14px);
  letter-spacing:1px;
  margin-bottom:8px;
}
.modal-header .mtypes{display:flex;gap:5px;flex-wrap:wrap}

.modal-close{
  background:var(--red);border:none;color:#fff;
  font-family:var(--pixel);font-size:9px;
  padding:8px 12px;border-radius:4px;cursor:pointer;
  flex-shrink:0;
  transition:background .15s;
}
.modal-close:hover{background:#ff3333}

.modal-body{padding:20px}

.modal-section{margin-bottom:16px}
.modal-section:last-child{margin-bottom:0}

.modal-section-title{
  color:#8899ff;
  font-size:clamp(6px,1vw,10px);
  letter-spacing:1px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.modal-section-title::before{content:'▶';color:var(--gold);font-size:7px}

.moves-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.move-pill{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:6px;
  padding:10px 12px;
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
}
.move-type-badge{
  font-size:7px;padding:3px 7px;border-radius:4px;
  color:#fff;text-transform:uppercase;letter-spacing:.5px;
  font-family:var(--pixel);
}
.move-name{
  color:#cce0ff;font-family:var(--vt);font-size:22px;
  letter-spacing:.5px;line-height:1;
}
.move-pp{
  color:var(--gold);font-family:var(--pixel);font-size:7px;
  letter-spacing:.5px;
}

.habil-box, .item-box{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:5px;
  padding:10px 14px;
  color:#fff;
  font-family:var(--vt);
  font-size:22px;
  display:flex;align-items:center;gap:8px;
}
.habil-box .icon, .item-box .icon{font-size:20px}
</style>
</head>
<body>
<div class="card">

  <div class="card-header">
    <span class="lbl">✦ TRAINER CARD</span>

  <div class="card-body">

        <!--

<!-- MODAL POPUP -->
<div class="modal-overlay" id="modal-overlay">

        <div class="modal-section-title">OBJETO</div>
        <div class="item-box"><span class="icon">🎒</span><span id="modal-item"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── MAPA español → slug inglés para PokeAPI ─────────────
const MOVE_API = {
  "Cascada":        "waterfall",
  "Puño Hielo":     "ice-punch",
  "Terremoto":      "earthquake",
  "Relajo":         "slack-off",
  "Drenadoras":     "leech-seed",
  "Tóxico":         "toxic",
  "Protección":     "protect",
  "Energibola":     "energy-ball",
  "Trueno":         "thunder",
  "Red Viscosa":    "sticky-web",
  "Zumbido":        "bug-buzz",
  "Electrotela":    "electroweb",
  "Martillo Coloso":"gigaton-hammer",
  "Carantoña":      "play-rough",
  "Danza Espada":   "swords-dance",
  "Sorpresa":       "sucker-punch",
  "Fuego Fatuo":    "will-o-wisp",
  "Lanzallamas":    "flamethrower",
  "Bola Sombra":    "shadow-ball",
  "Paz Mental":     "calm-mind",
  "A Bocajarro":    "superpower",
  "Psicocorte":     "psycho-cut",
  "Desarme":        "knock-off",
  "Avalancha":      "avalanche",
};

const TEAM = [
  {
    name:"SWAMPERT", types:["water","ground"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/260.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/260.png",
    moves:["Cascada","Puño Hielo","Terremoto","Relajo"],
    ability:"Humedad", item:"Chaleco Asalto"
  },
  {
    name:"ROSERADE", types:["grass","poison"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/407.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/407.png",
    moves:["Drenadoras","Tóxico","Protección","Energibola"],
    ability:"Punto Tóxico", item:"Lodo Negro"
  },
  {
    name:"GALVANTULA", types:["bug","electric"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/596.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/596.png",
    moves:["Trueno","Red Viscosa","Zumbido","Electrotela"],
    ability:"Ojo Compuesto", item:"Gafas Elección"
  },
  {
    name:"TINKATON", types:["fairy","steel"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/959.png",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/959.png",
    moves:["Martillo Coloso","Carantoña","Danza Espada","Sorpresa"],
    ability:"Rompemoldes", item:"Periscopio"
  },
  {
    name:"CHANDELURE✨", types:["ghost","fire"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/shiny/609.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/609.png",
    moves:["Fuego Fatuo","Lanzallamas","Bola Sombra","Paz Mental"],
    ability:"Absorbe Fuego", item:"Hechizo"
  },
  {
    name:"MALAMAR", types:["dark","psychic"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/687.png",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/687.png",
    moves:["A Bocajarro","Psicocorte","Desarme","Avalancha"],
    ability:"Respondón", item:"Restos"
  },
];

// ── CACHE de movimientos ya cargados ────────────────────
const MOVE_CACHE = {};

async function fetchMove(nameEs){
  if(MOVE_CACHE[nameEs]) return MOVE_CACHE[nameEs];
  const slug = MOVE_API[nameEs];
  if(!slug) return { pp:'?', type:'normal' };
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/move/${slug}`);
    const data = await res.json();
    const info = { pp: data.pp, type: data.type.name };
    MOVE_CACHE[nameEs] = info;
    return info;
  } catch {
    return { pp:'?', type:'normal' };
  }
}

// ── MODAL ────────────────────────────────────────────────
const overlay = document.getElementById('modal-overlay');

async function openModal(p){
  document.getElementById('modal-sprite').src = p.src;
  document.getElementById('modal-name').textContent = `${p.name}  Nv.${p.level}`;
  document.getElementById('modal-types').innerHTML  = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  document.getElementById('modal-ability').textContent = p.ability;
  document.getElementById('modal-item').textContent    = p.item;
  overlay.classList.add('open');

  // Mostrar ataques con skeleton mientras carga
  const grid = document.getElementById('modal-moves');
  grid.innerHTML = p.moves.map(m=>`
    <div class="move-pill" id="mp-${m.replace(/\s/g,'_')}">
      <div class="move-type-badge t-normal">···</div>
      <span class="move-name">${m}</span>
      <span class="move-pp">PP: …</span>
    </div>`).join('');

  // Cargar PP y tipo desde la API en paralelo
  await Promise.all(p.moves.map(async m => {
    const info = await fetchMove(m);
    const el   = document.getElementById(`mp-${m.replace(/\s/g,'_')}`);
    if(!el) return;
    el.querySelector('.move-type-badge').className = `move-type-badge t-${info.type}`;
    el.querySelector('.move-type-badge').textContent = info.type.toUpperCase();
    el.querySelector('.move-pp').textContent = `PP: ${info.pp}`;
  }));
}

document.getElementById('modal-close').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') overlay.classList.remove('open'); });

// ── SLOTS ────────────────────────────────────────────────
function buildSlot(p){
  const div = document.createElement('div');
  div.className = 'slot';

  const img = document.createElement('img');
  img.alt = p.name; img.src = p.src;
  img.onerror = () => { img.onerror=null; img.src=p.fallback; };
  div.appendChild(img);

  const nm = document.createElement('span'); nm.className='pname'; nm.textContent=p.name; div.appendChild(nm);
  const lv = document.createElement('span'); lv.className='plv';   lv.textContent=`Nv.${p.level}`; div.appendChild(lv);
  const ty = document.createElement('div');  ty.className='types';
  ty.innerHTML = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  div.appendChild(ty);

  div.addEventListener('click', ()=> openModal(p));
  return div;
}

// ── RELOJ ────────────────────────────────────────────────
const DIAS = ['DOM','LUN','MAR','MIE','JUE','VIE','SÁB'];
function updateClock(){
  const now = new Date();
  document.getElementById('st-hours').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  document.getElementById('st-day').textContent   = `${DIAS[now.getDay()]} ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
}

// ── POKEMON ALEATORIOS CRUZANDO LA PANTALLA ───────────────
// Lista de IDs de pokemon de gen 1-5 para cruzar
const WALK_IDS = [
  25,52,54,56,79,113,133,143,175,196,197,
  198,225,228,231,234,239,240,249,250,
  280,300,302,303,311,312,315,325,327,
  393,399,403,417,427,431,447,448,
  495,509,519,529,531,546,548,551,572,577,585,
  587,590,592,595,597,599,613,619,621,626,629
];

function spawnWalkingPokemon(){
  const id  = WALK_IDS[Math.floor(Math.random() * WALK_IDS.length)];
  const el  = document.createElement('div');
  const goRight = Math.random() > 0.5;
  const top = 10 + Math.random() * 80; // % de altura
  const size = 40 + Math.floor(Math.random() * 28);
  const dur  = 8 + Math.random() * 10;

  el.style.cssText = `
    position:fixed;
    top:${top}vh;
    ${goRight ? 'left:-80px' : 'right:-80px'};
    width:${size}px;height:${size}px;
    z-index:50;pointer-events:none;
    image-rendering:pixelated;
    transition:none;
    animation:walkPoke${goRight?'R':'L'} ${dur}s linear forwards;
  `;

  const img = document.createElement('img');
  img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${id}.gif`;
  img.onerror = () => { img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`; };
  img.style.cssText = `width:100%;height:100%;object-fit:contain;image-rendering:pixelated;transform:scaleX(${goRight ? 1 : -1})`;
  el.appendChild(img);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 500);
}

// Spawn cada 6-14 segundos
function scheduleWalk(){
  spawnWalkingPokemon();
  setTimeout(scheduleWalk, 6000 + Math.random() * 8000);
}

// ── PC POKÉMON (botón flotante) ──────────────────────────
// Pool de 30 pokemon random del PC (gen 1-5)
const PC_BOXES = [
  // Box 1 – Hoenn
  [4,7,1,152,155,158],
  // Box 2 – varios
  [143,94,131,149,248,245],
  // Box 3 – gen 5
  [495,501,504,506,509,519],
  // Box 4 – favoritos
  [25,133,39,129,132,52],
  // Box 5 – legendarios
  [144,145,146,150,151,249],
];

let pcOpen = false;
let currentBox = 0;

function buildPC(){
  // Botón PC flotante
  const btn = document.createElement('button');
  btn.id = 'pc-btn';
  btn.innerHTML = `<span>💾</span> PC`;
  btn.style.cssText = `
    position:fixed;bottom:24px;right:24px;z-index:200;
    background:#0d1244;border:3px solid #f5c842;border-radius:6px;
    color:#f5c842;font-family:'Press Start 2P',monospace;font-size:9px;
    padding:10px 14px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
    display:flex;align-items:center;gap:6px;
    transition:background .15s,transform .15s;
  `;
  btn.onmouseover = () => btn.style.background='#1a2fa8';
  btn.onmouseout  = () => btn.style.background='#0d1244';
  btn.onclick = togglePC;
  document.body.appendChild(btn);

  // Ventana PC
  const win = document.createElement('div');
  win.id = 'pc-window';
  win.style.cssText = `
    position:fixed;bottom:80px;right:24px;z-index:199;
    width:340px;
    background:#0d1244;border:4px solid #f5c842;border-radius:8px;
    box-shadow:0 0 0 2px #000,6px 6px 0 rgba(0,0,0,.6);
    font-family:'Press Start 2P',monospace;
    display:none;overflow:hidden;
  `;

  win.innerHTML = `
    <div id="pc-header" style="background:#060e33;border-bottom:3px solid #f5c842;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="color:#f5c842;font-size:8px;letter-spacing:1px;">📦 PC DE BILL</span>
      <button onclick="togglePC()" style="background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:7px;padding:4px 8px;border-radius:3px;cursor:pointer;">✕</button>
    </div>
    <div style="padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;">
      <button onclick="changeBox(-1)" style="background:#1a2fa8;border:2px solid #f5c842;color:#f5c842;font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 9px;border-radius:3px;cursor:pointer;">◀</button>
      <span id="pc-box-name" style="color:#aabfff;font-size:7px;letter-spacing:1px;">CAJA 1</span>
      <button onclick="changeBox(1)" style="background:#1a2fa8;border:2px solid #f5c842;color:#f5c842;font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 9px;border-radius:3px;cursor:pointer;">▶</button>
    </div>
    <div id="pc-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 12px;"></div>
    <div id="pc-info" style="border-top:2px solid #1a2fa8;padding:8px 12px;min-height:36px;"></div>
  `;
  document.body.appendChild(win);
  renderPCBox();
}

function togglePC(){
  pcOpen = !pcOpen;
  document.getElementById('pc-window').style.display = pcOpen ? 'block' : 'none';
}

const PC_BOX_NAMES = ['CAJA HOENN','CAJA KANTO II','CAJA UNOVA','CAJA FAVORITOS','CAJA LEGENDARIOS'];

function changeBox(dir){
  currentBox = (currentBox + dir + PC_BOXES.length) % PC_BOXES.length;
  document.getElementById('pc-box-name').textContent = PC_BOX_NAMES[currentBox];
  renderPCBox();
}

async function renderPCBox(){
  const grid = document.getElementById('pc-grid');
  grid.innerHTML = '';
  const ids = PC_BOXES[currentBox];
  for(const id of ids){
    const slot = document.createElement('div');
    slot.style.cssText = `
      background:#0a1d44;border:2px solid #1e44aa;border-radius:5px;
      display:flex;flex-direction:column;align-items:center;
      padding:6px 4px;cursor:pointer;
      transition:border-color .15s,transform .15s;
    `;
    slot.onmouseover = () => { slot.style.borderColor='#f5c842'; slot.style.transform='translateY(-3px)'; showPCInfo(id); };
    slot.onmouseout  = () => { slot.style.borderColor='#1e44aa'; slot.style.transform=''; };

    const img = document.createElement('img');
    img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${id}.gif`;
    img.onerror = () => { img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`; };
    img.style.cssText = 'width:60px;height:60px;object-fit:contain;image-rendering:pixelated;';

    slot.appendChild(img);
    grid.appendChild(slot);
  }
  document.getElementById('pc-info').innerHTML = `<span style="color:#555;font-size:6px;">Pasa el ratón sobre un Pokémon</span>`;
}

const PC_INFO_CACHE = {};
async function showPCInfo(id){
  const info = document.getElementById('pc-info');
  if(PC_INFO_CACHE[id]){
    info.innerHTML = PC_INFO_CACHE[id]; return;
  }
  info.innerHTML = `<span style="color:#555;font-size:6px;">Cargando...</span>`;
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    const data = await res.json();
    const name = data.name.toUpperCase();
    const types = data.types.map(t=>`<span style="font-size:5px;padding:2px 5px;border-radius:3px;color:#fff;background:${typeColor(t.type.name)};text-transform:uppercase;">${t.type.name}</span>`).join(' ');
    const hp  = data.stats.find(s=>s.stat.name==='hp')?.base_stat ?? '?';
    const atk = data.stats.find(s=>s.stat.name==='attack')?.base_stat ?? '?';
    const spd = data.stats.find(s=>s.stat.name==='speed')?.base_stat ?? '?';
    const html = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="color:#f5c842;font-size:7px;">${name}</span>
      ${types}
      <span style="color:#aabfff;font-size:6px;">PS:${hp}</span>
      <span style="color:#ffaaaa;font-size:6px;">AT:${atk}</span>
      <span style="color:#aaffaa;font-size:6px;">VE:${spd}</span>
    </div>`;
    PC_INFO_CACHE[id] = html;
    info.innerHTML = html;
  } catch { info.innerHTML = `<span style="color:#555;font-size:6px;">Error al cargar</span>`; }
}

function typeColor(t){
  const m = {water:'#3a7eee',grass:'#3da820',ground:'#b07a30',fire:'#e85010',
    ice:'#3dbcbc',electric:'#c8a800',bug:'#7a9a10',rock:'#887832',ghost:'#5c3a88',
    poison:'#882288',steel:'#7a8fa0',fairy:'#cc5599',dark:'#3a3a44',
    flying:'#6688cc',fighting:'#8a3010',psychic:'#cc2255',dragon:'#4418d8',normal:'#7a7a66'};
  return m[t]||'#555';
}

// ── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('team-grid');
  TEAM.forEach(p => grid.appendChild(buildSlot(p)));
  updateClock();
  setInterval(updateClock, 1000);

  // Primer pokemon a los 3 segundos, luego cada X segundos
  setTimeout(scheduleWalk, 3000);

  // PC
  buildPC();
});
</script>
