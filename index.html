<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Card – Aritz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1244;--blue:#1a2fa8;
  --gold:#f5c842;--red:#cc2222;--green:#7cb836;
  --pixel:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:var(--green);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);
  font-family:var(--pixel);
  padding:16px;
}

/* ── CARD ocupa todo el ancho disponible hasta 960px ── */
.card{
  width:100%;
  max-width:960px;
  background:var(--blue);
  border:4px solid var(--gold);
  border-radius:10px;
  box-shadow:0 0 0 2px #000,10px 10px 0 rgba(0,0,0,.5);
  overflow:hidden;
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes cardIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ── HEADER ── */
.card-header{
  background:var(--navy);border-bottom:3px solid var(--gold);
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;
}
.card-header .lbl{color:var(--gold);font-size:clamp(7px,1.2vw,13px);letter-spacing:2px}
.card-header .num{color:#8899ff;font-size:clamp(6px,1vw,11px)}

/* ── BODY: columna izquierda + derecha ── */
.card-body{
  display:grid;
  grid-template-columns:clamp(160px,25%,280px) 1fr;
}

/* ── LEFT ── */
.left{
  background:linear-gradient(160deg,#1833bb,#0a1266);
  border-right:3px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 12px 14px;gap:14px;
}
.avatar-frame{
  width:clamp(120px,18vw,220px);
  height:clamp(120px,18vw,220px);
  border:3px solid var(--gold);border-radius:6px;
  background:#0e1a77;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.avatar-frame img{width:100%;height:100%;object-fit:contain;object-position:center}
.avatar-frame svg{width:100%;height:100%}

.stats{width:100%}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:6px 3px;
  font-size:clamp(5px,0.9vw,9px);
}
.stat-row .k{color:#99aadd}
.stat-row .v{color:#fff}
.stat-row .v.gold{color:var(--gold)}

/* ── RIGHT ── */
.right{
  padding:16px 14px 18px;
  display:flex;flex-direction:column;gap:12px;
}
.team-lbl{
  color:var(--gold);
  font-size:clamp(6px,1vw,11px);
  letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.team-lbl::before{content:'▶';color:#fff;font-size:clamp(5px,.8vw,9px)}

.team-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  flex:1;
}

/* ── POKEMON SLOT ── */
.slot{
  background:#0a1d44;border:2px solid #1e44aa;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 6px 8px;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,background .15s;
}
.slot:hover{border-color:var(--gold);background:#142a66;transform:translateY(-5px)}

.slot img{
  width:clamp(60px,9vw,110px);
  height:clamp(60px,9vw,110px);
  object-fit:contain;
  image-rendering:pixelated;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.7));
}
.slot .pname{
  color:#cce0ff;
  font-size:clamp(5px,.8vw,8px);
  text-align:center;margin-top:5px;letter-spacing:.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;
}
.slot .plv{color:#88aadd;font-size:clamp(4px,.65vw,7px);margin-top:2px}

.types{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.tb{
  font-size:clamp(4px,.65vw,7px);
  padding:2px 5px;border-radius:3px;color:#fff;
  text-transform:uppercase;letter-spacing:.3px;
}
.t-water{background:#3a7eee}.t-grass{background:#3da820}.t-ground{background:#b07a30}
.t-fire{background:#e85010}.t-ice{background:#3dbcbc}.t-electric{background:#c8a800}
.t-bug{background:#7a9a10}.t-rock{background:#887832}.t-ghost{background:#5c3a88}
.t-poison{background:#882288}.t-steel{background:#7a8fa0}.t-fairy{background:#cc5599}
.t-dark{background:#3a3a44}.t-flying{background:#6688cc}.t-fighting{background:#8a3010}
.t-psychic{background:#cc2255}.t-dragon{background:#4418d8}.t-normal{background:#7a7a66}

/* Tooltip */
.tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#05051a;color:#dde8ff;font-family:var(--vt);font-size:15px;
  padding:8px 12px;border-radius:4px;border:1px solid var(--gold);
  white-space:nowrap;z-index:99;pointer-events:none;
  opacity:0;transition:opacity .15s;text-align:center;line-height:1.6;
}
.slot:hover .tip{opacity:1}

/* ── FOOTER ── */
.card-footer{
  background:var(--navy);border-top:3px solid var(--gold);
  padding:9px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.card-footer .ftag{color:#8899ff;font-size:clamp(5px,.8vw,8px);letter-spacing:.5px}
.card-footer .fid{color:var(--gold);font-size:clamp(5px,.8vw,8px)}

/* ── RESPONSIVE móvil ── */
@media(max-width:540px){
  .card-body{grid-template-columns:1fr}
  .left{border-right:none;border-bottom:3px solid rgba(255,255,255,.12);flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px;padding:14px}
  .avatar-frame{width:100px;height:100px}
  .stats{min-width:160px;flex:1}
  .team-grid{grid-template-columns:repeat(3,1fr)}
  .slot img{width:56px;height:56px}
}

/* ── MODAL POPUP ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  padding:16px;
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal{
  background:var(--navy);
  border:3px solid var(--gold);
  border-radius:8px;
  box-shadow:0 0 0 2px #000, 6px 6px 0 rgba(0,0,0,.6);
  width:100%;max-width:380px;
  overflow:hidden;
  transform:scale(.85) translateY(20px);
  transition:transform .2s;
}
.modal-overlay.open .modal{transform:none}

.modal-header{
  background:#060e33;
  border-bottom:2px solid var(--gold);
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.modal-header .msprite{
  width:64px;height:64px;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
}
.modal-header .minfo{flex:1}
.modal-header .mname{
  color:var(--gold);
  font-size:clamp(7px,1.5vw,11px);
  letter-spacing:1px;
  margin-bottom:5px;
}
.modal-header .mtypes{display:flex;gap:4px;flex-wrap:wrap}

.modal-close{
  background:var(--red);border:none;color:#fff;
  font-family:var(--pixel);font-size:9px;
  padding:5px 8px;border-radius:3px;cursor:pointer;
  flex-shrink:0;
  transition:background .15s;
}
.modal-close:hover{background:#ff3333}

.modal-body{padding:14px}

.modal-section{margin-bottom:12px}
.modal-section:last-child{margin-bottom:0}

.modal-section-title{
  color:#8899ff;
  font-size:clamp(5px,.9vw,8px);
  letter-spacing:1px;
  margin-bottom:7px;
  display:flex;align-items:center;gap:5px;
}
.modal-section-title::before{content:'▶';color:var(--gold);font-size:6px}

.moves-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;
}
.move-pill{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:4px;
  padding:6px 7px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
}
.move-type-badge{
  font-size:5px;padding:2px 5px;border-radius:3px;
  color:#fff;text-transform:uppercase;letter-spacing:.5px;
  font-family:var(--pixel);
}
.move-name{
  color:#cce0ff;font-family:var(--vt);font-size:16px;
  letter-spacing:.5px;line-height:1;
}
.move-pp{
  color:var(--gold);font-family:var(--pixel);font-size:5px;
  letter-spacing:.5px;
}

.habil-box, .item-box{
  background:#0a1d44;
  border:1px solid #2244aa;
  border-radius:3px;
  padding:6px 10px;
  color:#fff;
  font-family:var(--vt);
  font-size:16px;
  display:flex;align-items:center;gap:6px;
}
.habil-box .icon, .item-box .icon{font-size:16px}
</style>
</head>
<body>
<div class="card">

  <div class="card-header">
    <span class="lbl">✦ TRAINER CARD</span>
    <span class="num">Nº 001</span>
  </div>

  <div class="card-body">

    <!-- LEFT -->
    <div class="left">
      <div class="avatar-frame">
        <!--
        =====================================================
          AVATAR DEL ENTRENADOR
          Borra el <svg> de aquí abajo y pon tu imagen así:
            <img src="ghetsis-pokemon.gif" alt="Aritz">
          o con URL:
            <img src="https://ejemplo.com/foto.jpg" alt="Aritz">
        =====================================================
        -->
        <img src="ghetsis-pokemon.gif" alt="Aritz">
        <!-- FIN AVATAR -->
      </div>

      <div class="stats">
        <div class="stat-row"><span class="k">NOMBRE</span><span class="v gold">ARITZ</span></div>
        <div class="stat-row"><span class="k">REGION</span><span class="v">BASAURI</span></div>
        <div class="stat-row"><span class="k">JUEGO</span><span class="v gold">POKÉMON</span></div>
        <div class="stat-row"><span class="k">HORA</span><span class="v" id="st-hours">--:--</span></div>
        <div class="stat-row"><span class="k">DÍA</span><span class="v" id="st-day">---</span></div>
        <div class="stat-row"><span class="k">ID Nº</span><span class="v">00001</span></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="team-lbl">EQUIPO ACTUAL</div>
      <div class="team-grid" id="team-grid"></div>
    </div>

  </div>

  <div class="card-footer">
    <span class="ftag">POKÉMON · BASAURI</span>
    <span class="fid">★ ARITZ ★</span>
  </div>

</div>

<!-- MODAL POPUP -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <img class="msprite" id="modal-sprite" src="" alt="">
      <div class="minfo">
        <div class="mname" id="modal-name"></div>
        <div class="mtypes" id="modal-types"></div>
      </div>
      <button class="modal-close" id="modal-close">✕ CERRAR</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title">ATAQUES</div>
        <div class="moves-grid" id="modal-moves"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">HABILIDAD</div>
        <div class="habil-box"><span class="icon">🔮</span><span id="modal-ability"></span></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">OBJETO</div>
        <div class="item-box"><span class="icon">🎒</span><span id="modal-item"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── MAPA español → slug inglés para PokeAPI ─────────────
const MOVE_API = {
  "Cascada":        "waterfall",
  "Puño Hielo":     "ice-punch",
  "Terremoto":      "earthquake",
  "Relajo":         "slack-off",
  "Drenadoras":     "leech-seed",
  "Tóxico":         "toxic",
  "Protección":     "protect",
  "Energibola":     "energy-ball",
  "Trueno":         "thunder",
  "Red Viscosa":    "sticky-web",
  "Zumbido":        "bug-buzz",
  "Electrotela":    "electroweb",
  "Martillo Coloso":"gigaton-hammer",
  "Carantoña":      "play-rough",
  "Danza Espada":   "swords-dance",
  "Sorpresa":       "sucker-punch",
  "Fuego Fatuo":    "will-o-wisp",
  "Lanzallamas":    "flamethrower",
  "Bola Sombra":    "shadow-ball",
  "Paz Mental":     "calm-mind",
  "A Bocajarro":    "superpower",
  "Psicocorte":     "psycho-cut",
  "Desarme":        "knock-off",
  "Avalancha":      "avalanche",
};

const TEAM = [
  {
    name:"SWAMPERT", types:["water","ground"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/260.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/260.png",
    moves:["Cascada","Puño Hielo","Terremoto","Relajo"],
    ability:"Humedad", item:"Chaleco Asalto"
  },
  {
    name:"ROSERADE", types:["grass","poison"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/407.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/407.png",
    moves:["Drenadoras","Tóxico","Protección","Energibola"],
    ability:"Punto Tóxico", item:"Lodo Negro"
  },
  {
    name:"GALVANTULA", types:["bug","electric"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/596.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/596.png",
    moves:["Trueno","Red Viscosa","Zumbido","Electrotela"],
    ability:"Ojo Compuesto", item:"Gafas Elección"
  },
  {
    name:"TINKATON", types:["fairy","steel"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/959.png",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/959.png",
    moves:["Martillo Coloso","Carantoña","Danza Espada","Sorpresa"],
    ability:"Rompemoldes", item:"Periscopio"
  },
  {
    name:"CHANDELURE✨", types:["ghost","fire"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/shiny/609.gif",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/609.png",
    moves:["Fuego Fatuo","Lanzallamas","Bola Sombra","Paz Mental"],
    ability:"Absorbe Fuego", item:"Hechizo"
  },
  {
    name:"MALAMAR", types:["dark","psychic"], level:50,
    src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/687.png",
    fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/687.png",
    moves:["A Bocajarro","Psicocorte","Desarme","Avalancha"],
    ability:"Respondón", item:"Restos"
  },
];

// ── CACHE de movimientos ya cargados ────────────────────
const MOVE_CACHE = {};

async function fetchMove(nameEs){
  if(MOVE_CACHE[nameEs]) return MOVE_CACHE[nameEs];
  const slug = MOVE_API[nameEs];
  if(!slug) return { pp:'?', type:'normal' };
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/move/${slug}`);
    const data = await res.json();
    const info = { pp: data.pp, type: data.type.name };
    MOVE_CACHE[nameEs] = info;
    return info;
  } catch {
    return { pp:'?', type:'normal' };
  }
}

// ── MODAL ────────────────────────────────────────────────
const overlay = document.getElementById('modal-overlay');

async function openModal(p){
  document.getElementById('modal-sprite').src = p.src;
  document.getElementById('modal-name').textContent = `${p.name}  Nv.${p.level}`;
  document.getElementById('modal-types').innerHTML  = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  document.getElementById('modal-ability').textContent = p.ability;
  document.getElementById('modal-item').textContent    = p.item;
  overlay.classList.add('open');

  // Mostrar ataques con skeleton mientras carga
  const grid = document.getElementById('modal-moves');
  grid.innerHTML = p.moves.map(m=>`
    <div class="move-pill" id="mp-${m.replace(/\s/g,'_')}">
      <div class="move-type-badge t-normal">···</div>
      <span class="move-name">${m}</span>
      <span class="move-pp">PP: …</span>
    </div>`).join('');

  // Cargar PP y tipo desde la API en paralelo
  await Promise.all(p.moves.map(async m => {
    const info = await fetchMove(m);
    const el   = document.getElementById(`mp-${m.replace(/\s/g,'_')}`);
    if(!el) return;
    el.querySelector('.move-type-badge').className = `move-type-badge t-${info.type}`;
    el.querySelector('.move-type-badge').textContent = info.type.toUpperCase();
    el.querySelector('.move-pp').textContent = `PP: ${info.pp}`;
  }));
}

document.getElementById('modal-close').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') overlay.classList.remove('open'); });

// ── SLOTS ────────────────────────────────────────────────
function buildSlot(p){
  const div = document.createElement('div');
  div.className = 'slot';

  const img = document.createElement('img');
  img.alt = p.name; img.src = p.src;
  img.onerror = () => { img.onerror=null; img.src=p.fallback; };
  div.appendChild(img);

  const nm = document.createElement('span'); nm.className='pname'; nm.textContent=p.name; div.appendChild(nm);
  const lv = document.createElement('span'); lv.className='plv';   lv.textContent=`Nv.${p.level}`; div.appendChild(lv);
  const ty = document.createElement('div');  ty.className='types';
  ty.innerHTML = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  div.appendChild(ty);

  div.addEventListener('click', ()=> openModal(p));
  return div;
}

// ── RELOJ ────────────────────────────────────────────────
const DIAS = ['DOM','LUN','MAR','MIE','JUE','VIE','SÁB'];
function updateClock(){
  const now = new Date();
  document.getElementById('st-hours').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  document.getElementById('st-day').textContent   = `${DIAS[now.getDay()]} ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
}

// ── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('team-grid');
  TEAM.forEach(p => grid.appendChild(buildSlot(p)));
  updateClock();
  setInterval(updateClock, 1000);
});
</script>
</body>
</html>
