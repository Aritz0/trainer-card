<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Card – Aritz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1244;--blue:#1a2fa8;
  --gold:#f5c842;--red:#cc2222;--green:#7cb836;
  --pixel:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:var(--green);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);
  font-family:var(--pixel);
  padding:20px;
}

.card{
  width:100%;max-width:1200px;
  background:var(--blue);border:5px solid var(--gold);border-radius:12px;
  box-shadow:0 0 0 3px #000,12px 12px 0 rgba(0,0,0,.5);
  overflow:hidden;animation:cardIn .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes cardIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:none;opacity:1}}

.card-header{
  background:var(--navy);border-bottom:4px solid var(--gold);
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 28px;
}
.card-header .lbl{color:var(--gold);font-size:clamp(9px,1.4vw,16px);letter-spacing:2px}
.card-header .num{color:#8899ff;font-size:clamp(8px,1.1vw,13px)}

.card-body{display:grid;grid-template-columns:clamp(200px,28%,340px) 1fr;}

.left{
  background:linear-gradient(160deg,#1833bb,#0a1266);
  border-right:3px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 18px;gap:18px;
}
.avatar-frame{
  width:clamp(150px,20vw,260px);height:clamp(150px,20vw,260px);
  border:4px solid var(--gold);border-radius:8px;
  background:#0e1a77;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.avatar-frame img{width:100%;height:100%;object-fit:contain;object-position:center}

.stats{width:100%}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);padding:8px 4px;font-size:clamp(6px,1vw,11px);
}
.stat-row .k{color:#99aadd}
.stat-row .v{color:#fff}
.stat-row .v.gold{color:var(--gold)}

.right{padding:22px 18px 24px;display:flex;flex-direction:column;gap:16px;}
.team-lbl{
  color:var(--gold);font-size:clamp(8px,1.2vw,14px);letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.team-lbl::before{content:'▶';color:#fff;font-size:clamp(6px,.9vw,10px)}

.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;}

.slot{
  background:#0a1d44;border:2px solid #1e44aa;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 8px 10px;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,background .15s;
}
.slot:hover{border-color:var(--gold);background:#142a66;transform:translateY(-6px)}
.slot img{
  width:clamp(80px,11vw,140px);height:clamp(80px,11vw,140px);
  object-fit:contain;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
}
.slot .pname{color:#cce0ff;font-size:clamp(6px,.9vw,10px);text-align:center;margin-top:7px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.slot .plv{color:#88aadd;font-size:clamp(5px,.75vw,8px);margin-top:3px}

.types{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;justify-content:center}
.tb{font-size:clamp(5px,.7vw,8px);padding:3px 6px;border-radius:3px;color:#fff;text-transform:uppercase;letter-spacing:.3px;}
.t-water{background:#3a7eee}.t-grass{background:#3da820}.t-ground{background:#b07a30}
.t-fire{background:#e85010}.t-ice{background:#3dbcbc}.t-electric{background:#c8a800}
.t-bug{background:#7a9a10}.t-rock{background:#887832}.t-ghost{background:#5c3a88}
.t-poison{background:#882288}.t-steel{background:#7a8fa0}.t-fairy{background:#cc5599}
.t-dark{background:#3a3a44}.t-flying{background:#6688cc}.t-fighting{background:#8a3010}
.t-psychic{background:#cc2255}.t-dragon{background:#4418d8}.t-normal{background:#7a7a66}

.hp-bar-wrap{width:90%;height:6px;background:#1a1a3a;border-radius:3px;margin-top:5px;overflow:hidden;border:1px solid rgba(255,255,255,.15);}
.hp-bar{height:100%;border-radius:3px;transition:width .4s,background .4s}
.hp-text{color:#aac8ff;font-size:4px;margin-top:2px;letter-spacing:.3px}
.slot.fainted img{filter:grayscale(1) brightness(.6) !important;}
.slot.fainted{border-color:#444 !important;background:#0a0a1a !important;}
.slot.fainted .pname{color:#666 !important;}
.slot.fainted .hp-text{color:#cc2222 !important;}
.fainted-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.7);color:#cc2222;font-size:6px;padding:3px 6px;border-radius:3px;
  letter-spacing:1px;pointer-events:none;border:1px solid #cc2222;
}

.card-footer{
  background:var(--navy);border-top:4px solid var(--gold);
  padding:12px 28px;display:flex;justify-content:space-between;align-items:center;
}
.card-footer .ftag{color:#8899ff;font-size:clamp(6px,.9vw,10px);letter-spacing:.5px}
.card-footer .fid{color:var(--gold);font-size:clamp(6px,.9vw,10px)}

@media(max-width:620px){
  .card-body{grid-template-columns:1fr}
  .left{border-right:none;border-bottom:3px solid rgba(255,255,255,.12);flex-direction:row;flex-wrap:wrap;justify-content:center;gap:14px;padding:16px}
  .avatar-frame{width:120px;height:120px}
  .stats{min-width:180px;flex:1}
  .slot img{width:70px;height:70px}
}

/* ── MODAL BASE ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;
  z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--navy);border:4px solid var(--gold);border-radius:10px;
  box-shadow:0 0 0 2px #000,8px 8px 0 rgba(0,0,0,.6);
  width:100%;max-width:560px;overflow:hidden;
  transform:scale(.85) translateY(20px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:none}
.modal-header{
  background:#060e33;border-bottom:3px solid var(--gold);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.modal-header .msprite{width:96px;height:96px;image-rendering:pixelated;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));}
.modal-header .minfo{flex:1}
.modal-header .mname{color:var(--gold);font-size:clamp(9px,1.6vw,14px);letter-spacing:1px;margin-bottom:8px;}
.modal-header .mtypes{display:flex;gap:5px;flex-wrap:wrap}
.modal-close{background:var(--red);border:none;color:#fff;font-family:var(--pixel);font-size:9px;padding:8px 12px;border-radius:4px;cursor:pointer;flex-shrink:0;transition:background .15s;}
.modal-close:hover{background:#ff3333}
.modal-body{padding:20px}
.modal-section{margin-bottom:16px}
.modal-section:last-child{margin-bottom:0}
.modal-section-title{color:#8899ff;font-size:clamp(6px,1vw,10px);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.modal-section-title::before{content:'▶';color:var(--gold);font-size:7px}
.moves-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.move-pill{background:#0a1d44;border:1px solid #2244aa;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
.move-type-badge{font-size:7px;padding:3px 7px;border-radius:4px;color:#fff;text-transform:uppercase;letter-spacing:.5px;font-family:var(--pixel);}
.move-name{color:#cce0ff;font-family:var(--vt);font-size:22px;letter-spacing:.5px;line-height:1;}
.move-pp{color:var(--gold);font-family:var(--pixel);font-size:7px;letter-spacing:.5px;}
.habil-box,.item-box{background:#0a1d44;border:1px solid #2244aa;border-radius:5px;padding:10px 14px;color:#fff;font-family:var(--vt);font-size:22px;display:flex;align-items:center;gap:8px;}
.habil-box .icon,.item-box .icon{font-size:20px}

/* ── COMBATE DIARIO ── */
#combat-btn{
  position:fixed;bottom:24px;left:24px;z-index:200;
  background:#0d1244;border:3px solid #44ff88;border-radius:6px;
  color:#44ff88;font-family:'Press Start 2P',monospace;font-size:9px;
  padding:10px 16px;cursor:pointer;
  box-shadow:3px 3px 0 rgba(0,0,0,.5),0 0 12px rgba(68,255,136,.3);
  transition:background .15s;letter-spacing:1px;
}
#combat-btn:hover{background:#1a2fa8}
#combat-btn.locked{border-color:#cc2222;color:#cc2222;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
#combat-btn.gym{border-color:#f5c842;color:#f5c842;box-shadow:3px 3px 0 rgba(0,0,0,.5),0 0 20px rgba(245,200,66,.5);animation:pulse-gym 1.5s infinite;}
@keyframes pulse-gym{0%,100%{box-shadow:3px 3px 0 rgba(0,0,0,.5),0 0 20px rgba(245,200,66,.5)}50%{box-shadow:3px 3px 0 rgba(0,0,0,.5),0 0 35px rgba(245,200,66,.8)}}

/* ── COMBAT WINDOW ── */
#combat-window{
  position:fixed;bottom:76px;left:24px;z-index:199;
  width:420px;max-width:calc(100vw - 48px);
  background:#0a0e2a;border:4px solid #44ff88;border-radius:8px;
  box-shadow:0 0 0 2px #000,6px 6px 0 rgba(0,0,0,.7);
  font-family:'Press Start 2P',monospace;
  display:none;overflow:hidden;
  max-height:90vh;overflow-y:auto;
}
#combat-window.gym-mode{border-color:#f5c842;}

.cw-header{
  background:#060e33;border-bottom:3px solid #44ff88;
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
}
.cw-header.gym{border-bottom-color:#f5c842;}
.cw-title{color:#44ff88;font-size:8px;letter-spacing:1px;}
.cw-title.gym{color:#f5c842;}
.cw-close{background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:7px;padding:4px 8px;border-radius:3px;cursor:pointer;}

/* Arena de combate */
.arena{
  background:linear-gradient(180deg,#0a1a44 0%,#0d0d1a 100%);
  padding:16px;display:flex;flex-direction:column;gap:12px;
}
.arena-field{
  display:flex;justify-content:space-between;align-items:flex-end;
  min-height:130px;
  background:linear-gradient(180deg,#080f2a,#0a1432);
  border-radius:8px;border:2px solid #1a2a66;padding:12px;
  position:relative;overflow:hidden;
}
.arena-field::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#44ff88,transparent);
}
.arena-field.gym-field::after{background:linear-gradient(90deg,transparent,#f5c842,transparent);}

.fighter{display:flex;flex-direction:column;align-items:center;gap:4px;}
.fighter-sprite{width:80px;height:80px;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.8));}
.fighter-sprite.enemy{width:88px;height:88px;}
.fighter-name{font-size:5px;color:#aac8ff;letter-spacing:.3px;}
.fighter-hp-wrap{width:80px;height:5px;background:#1a1a3a;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.fighter-hp-bar{height:100%;border-radius:3px;transition:width .5s,background .5s;}

/* Diálogo de combate */
.battle-log{
  background:#060e1a;border:2px solid #1a2a66;border-radius:6px;
  padding:10px 12px;min-height:56px;max-height:90px;overflow-y:auto;
}
.battle-log p{color:#cce0ff;font-family:'VT323',monospace;font-size:18px;line-height:1.4;margin-bottom:2px;}
.battle-log p.highlight{color:#f5c842;}
.battle-log p.red{color:#ff5544;}
.battle-log p.green{color:#44ff88;}
.battle-log p.shiny{color:#ffdd44;}

/* Acciones */
.battle-actions{display:flex;flex-wrap:wrap;gap:6px;}
.ba-btn{
  background:#0d1744;border:2px solid #2244aa;border-radius:5px;
  color:#cce0ff;font-family:'Press Start 2P',monospace;font-size:6px;
  padding:8px 10px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
  letter-spacing:.3px;
}
.ba-btn:hover:not(:disabled){border-color:#f5c842;background:#142a66;transform:translateY(-2px);}
.ba-btn:disabled{opacity:.4;cursor:not-allowed;}
.ba-btn.attack{border-color:#e85010;color:#ffaa88;}
.ba-btn.ball{border-color:#3a7eee;color:#88ccff;}
.ba-btn.run{border-color:#555;color:#888;}
.ba-btn.next{border-color:#44ff88;color:#44ff88;background:#0a2a1a;}
.ba-btn.next.gym{border-color:#f5c842;color:#f5c842;background:#1a1200;}

/* Stats racha */
.streak-bar{
  background:#060e33;padding:8px 14px;border-bottom:2px solid #1a2a66;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.streak-badge{
  display:flex;align-items:center;gap:5px;
  color:#f5c842;font-size:7px;letter-spacing:.5px;
}
.streak-badge .fire{font-size:14px;}
.gym-progress{color:#8899ff;font-size:6px;letter-spacing:.3px;}
.gym-locked-msg{color:#cc2222;font-size:6px;}

/* Capture animation */
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-4px) rotate(-5deg)}
  40%{transform:translateX(4px) rotate(5deg)}
  60%{transform:translateX(-3px) rotate(-3deg)}
  80%{transform:translateX(3px) rotate(3deg)}
}
.shaking{animation:shake .5s ease-in-out;}

@keyframes wobble-ball{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-15deg)}
  75%{transform:rotate(15deg)}
}
.wobble{animation:wobble-ball .3s ease-in-out 3;}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <span class="lbl">✦ TRAINER CARD</span>
    <span class="num">Nº 001</span>
  </div>
  <div class="card-body">
    <div class="left">
      <div class="avatar-frame">
        <img src="ghetsis-pokemon.gif" alt="Aritz" onerror="this.src='https://play.pokemonshowdown.com/sprites/gen5/spr_ghetsis.png'">
      </div>
      <div class="stats">
        <div class="stat-row"><span class="k">NOMBRE</span><span class="v gold">ARITZ</span></div>
        <div class="stat-row"><span class="k">REGION</span><span class="v">BASAURI</span></div>
        <div class="stat-row"><span class="k">RACHA</span><span class="v gold" id="st-streak">0 🔥</span></div>
        <div class="stat-row"><span class="k">HORA</span><span class="v" id="st-hours">--:--</span></div>
        <div class="stat-row"><span class="k">DÍA</span><span class="v" id="st-day">---</span></div>
        <div class="stat-row"><span class="k">ID Nº</span><span class="v">00001</span></div>
        <div class="stat-row"><span class="k">MEDALLAS</span><span class="v gold" id="st-badges">0 🏅</span></div>
      </div>
    </div>
    <div class="right">
      <div class="team-lbl">EQUIPO ACTUAL</div>
      <div class="team-grid" id="team-grid"></div>
    </div>
  </div>
  <div class="card-footer">
    <span class="ftag">POKÉMON · BASAURI</span>
    <span class="fid">★ ARITZ ★</span>
  </div>
</div>

<!-- MODAL DETALLE POKEMON -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <img class="msprite" id="modal-sprite" src="" alt="">
      <div class="minfo">
        <div class="mname" id="modal-name"></div>
        <div class="mtypes" id="modal-types"></div>
        <div style="margin-top:8px;">
          <span id="modal-hp-text" style="color:#aac8ff;font-family:'Press Start 2P',monospace;font-size:6px;"></span>
          <div style="width:100%;height:8px;background:#0a0a2a;border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.2);margin-top:4px;">
            <div id="modal-hp-bar" style="height:100%;border-radius:4px;transition:width .4s,background .4s;"></div>
          </div>
        </div>
        <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">
          <button onclick="dealDamage(10)"  style="background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">-10</button>
          <button onclick="dealDamage(25)"  style="background:#992222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">-25</button>
          <button onclick="dealDamage(50)"  style="background:#771111;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">-50</button>
          <button onclick="dealDamage(999)" style="background:#440000;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 7px;border-radius:3px;cursor:pointer;">KO</button>
        </div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title">ATAQUES</div>
        <div class="moves-grid" id="modal-moves"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">HABILIDAD</div>
        <div class="habil-box"><span class="icon">🔮</span><span id="modal-ability"></span></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">OBJETO</div>
        <div class="item-box"><span class="icon">🎒</span><span id="modal-item"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- BOTÓN COMBATE -->
<button id="combat-btn" onclick="toggleCombat()">⚔️ COMBATE</button>

<!-- VENTANA DE COMBATE -->
<div id="combat-window">
  <div class="cw-header" id="cw-header">
    <span class="cw-title" id="cw-title">⚔️ COMBATE DIARIO</span>
    <button class="cw-close" onclick="toggleCombat()">✕</button>
  </div>
  <div class="streak-bar">
    <div class="streak-badge"><span class="fire">🔥</span><span id="streak-display">Racha: 0 días</span></div>
    <div>
      <span class="gym-progress" id="gym-progress-text"></span>
      <span class="gym-locked-msg" id="gym-locked-msg" style="display:none;"></span>
    </div>
  </div>
  <div class="arena" id="combat-arena">
    <!-- Contenido dinámico -->
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  DATOS DEL EQUIPO
// ══════════════════════════════════════════════════════════
let TEAM = [
  { name:"SWAMPERT",   types:["water","ground"], level:50, id:260, src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/260.gif", fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/260.png", moves:["Cascada","Puño Hielo","Terremoto","Relajo"], ability:"Humedad", item:"Chaleco Asalto", maxHp:160, hp:160 },
  { name:"ROSERADE",   types:["grass","poison"], level:50, id:407, src:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/407.gif", fallback:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/407.png", moves:["Drenadoras","Tóxico","Protección","Energibola"], ability:"Punto Tóxico", item:"Lodo Negro", maxHp:110, hp:110 },

//  ESTADO PERSISTENTE

function getState(){
  try {
    return JSON.parse(localStorage.getItem('aritz_trainer') || '{}');
  } catch { return {}; }
}
function saveState(s){
  try { localStorage.setItem('aritz_trainer', JSON.stringify(s)); } catch {}
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getWeekIndex(){
  // Semana del año para determinar qué líder toca
  const now = new Date();
  const start = new Date(now.getFullYear(),0,1);
  return Math.floor((now - start) / (7*24*3600*1000)) % GYM_LEADERS.length;
}

function isGymDay(){
  // El combate de gimnasio es el día 7 de cada racha (múltiplos de 7)
  const s = getState();
  return s.streak > 0 && s.streak % 7 === 0;
}

function hasCompletedToday(){
  const s = getState();
  return s.lastCombatDay === todayStr();
}

function getStreak(){ return getState().streak || 0; }
function getBadges(){ return getState().badges || 0; }

function updateStateAfterCombat(won){
  const s = getState();
  const today = todayStr();
  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate()-1);
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  })();

  s.lastCombatDay = today;
  if(won){
    // Racha: si ya combatió ayer, continúa; si no, reinicia
    if(s.lastCombatDay_prev === yesterday){
      s.streak = (s.streak || 0) + 1;
    } else if(!s.lastCombatDay_prev){
      s.streak = 1;
    } else {
      s.streak = 1; // racha rota
    }
  }
  s.lastCombatDay_prev = today;
  saveState(s);
  updateStreakDisplay();
}

function addBadge(){
  const s = getState();
  s.badges = (s.badges || 0) + 1;
  saveState(s);
  updateStreakDisplay();
}

function updateStreakDisplay(){
  const streak = getStreak();
  const badges = getBadges();
  document.getElementById('st-streak').textContent = `${streak} 🔥`;
  document.getElementById('st-badges').textContent  = `${badges} 🏅`;
  document.getElementById('streak-display').textContent = `Racha: ${streak} días`;

  const gymIdx = getWeekIndex();
  const leader = GYM_LEADERS[gymIdx];
  const daysToGym = 7 - (streak % 7 === 0 && streak > 0 ? 7 : streak % 7);
  const alreadyDone = getState().lastGymDay === todayStr();

  const gymText = document.getElementById('gym-progress-text');
  const gymLock = document.getElementById('gym-locked-msg');
  const btn     = document.getElementById('combat-btn');

  if(hasCompletedToday()){
    btn.textContent = '✔ YA COMBATISTE';
    btn.classList.remove('gym');
    btn.classList.add('locked');
    gymText.textContent = '';
    gymLock.style.display = 'none';
    return;
  }

  if(streak % 7 === 0 && streak >= 7){
    // ¡Día de gimnasio!
    btn.classList.add('gym');
    btn.classList.remove('locked');
    btn.textContent = `🏟️ GIMNASIO`;
    gymText.textContent = `🏅 ¡${leader.name} te reta!`;
    gymLock.style.display = 'none';
  } else {
    btn.classList.remove('gym','locked');
    btn.textContent = '⚔️ COMBATE';
    gymText.textContent = `${7 - streak % 7} días para gimnasio`;
    gymLock.style.display = 'none';
  }
}

let combatOpen = false;

function toggleCombat(){
  combatOpen = !combatOpen;
  const win = document.getElementById('combat-window');
  win.style.display = combatOpen ? 'block' : 'none';
  if(combatOpen && !combatState) initCombat();
}

function getSpriteUrl(id, animated=true, shiny=false){
  if(animated){
    const base = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated`;
    return shiny ? `${base}/shiny/${id}.gif` : `${base}/${id}.gif`;
  }
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}

function pickWildPokemon(){
  // Usar la fecha como seed para que sea el mismo todo el día
  const today = todayStr();
  let seed = 0;
  for(let i=0;i<today.length;i++) seed += today.charCodeAt(i);
  return WILD_POOL[seed % WILD_POOL.length];
}

function buildWildCombatant(template){
  const shiny = Math.random() < 0.02; // 2% shiny
  const hpBase = 40 + template.level * 2;
  return {
    ...template,
    shiny,
    maxHp: hpBase,
    hp: hpBase,
    src: getSpriteUrl(template.id, true, shiny),
    fallback: getSpriteUrl(template.id, false, shiny),
    caught: false,
  };
}

function buildGymCombatant(template){
  return {
    ...template,
    maxHp: template.maxHp,
    hp: template.maxHp,
    src: getSpriteUrl(template.id, true, false),
    fallback: getSpriteUrl(template.id, false, false),
  };
}

function initCombat(){
  const streak = getStreak();
  const isGym  = streak > 0 && streak % 7 === 0;
  const already = hasCompletedToday();

  const header = document.getElementById('cw-header');
  const title  = document.getElementById('cw-title');
  const win    = document.getElementById('combat-window');

  if(already){
    renderAlreadyDone();
    return;
  }

  if(isGym){
    // Verificar racha
    if(streak < 7){
      renderLockedGym(streak);
      return;
    }
    header.className = 'cw-header gym';
    title.className  = 'cw-title gym';
    win.className    = 'gym-mode';
    const gymIdx  = getWeekIndex();
    const leader  = GYM_LEADERS[gymIdx];
    title.textContent = `🏟️ LÍDER ${leader.name}`;
    combatState = {
      type: 'gym',
      leader,
      enemyQueue: leader.pokemon.map(buildGymCombatant),
      enemyIdx: 0,
      playerPoke: TEAM.find(p=>p.hp>0) || TEAM[0],
      phase: 'fighting', // fighting | victory | defeat
      log: [],
    };
  } else {
    header.className = 'cw-header';
    title.className  = 'cw-title';
    win.className    = '';
    title.textContent = '⚔️ COMBATE DIARIO';
    const template = pickWildPokemon();
    const wild = buildWildCombatant(template);
    combatState = {
      type: 'wild',
      enemy: wild,
      playerPoke: TEAM.find(p=>p.hp>0) || TEAM[0],
      phase: 'fighting',
      log: [],
      ballsUsed: 0,
    };
  }

  renderCombat();
}

function currentEnemy(){
  if(!combatState) return null;
  if(combatState.type === 'gym') return combatState.enemyQueue[combatState.enemyIdx];
  return combatState.enemy;
}

function renderCombat(){

  const cs = combatState;
  if(!cs){ arena.innerHTML=''; return; }

  const enemy = currentEnemy();
  const player = cs.playerPoke;
  const isGym  = cs.type === 'gym';

  const playerHpPct = Math.max(0, player.hp / player.maxHp * 100);

  const playerCol = hpColor2(player.hp, player.maxHp);

  const fieldClass = isGym ? 'arena-field gym-field' : 'arena-field';

  arena.innerHTML = `
    <div class="${fieldClass}">
      <!-- Enemigo -->
      <div class="fighter" style="flex-direction:column-reverse;align-items:flex-start;gap:4px;">
        ${gymBadgeHtml}
        <div style="display:flex;align-items:center;gap:4px;">
          <span style="color:#aac8ff;font-size:5px;">${enemy.name}${shinyBadge}</span>
          <span style="color:#88aadd;font-size:4px;">Nv.${enemy.level}</span>
        </div>
        <div style="width:90px;height:5px;background:#1a1a3a;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.1);">
          <div style="width:${enemyHpPct}%;height:100%;background:${enemyCol};border-radius:3px;transition:width .5s;"></div>
        </div>
        <span style="color:#aac8ff;font-size:4px;">PS: ${Math.max(0,enemy.hp)}/${enemy.maxHp}</span>
        <div style="display:flex;gap:3px;flex-wrap:wrap;">${enemy.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('')}</div>
      </div>
      <!-- Sprite enemigo (derecha, arriba) -->
      <img id="enemy-sprite" class="fighter-sprite enemy"
        src="${enemy.src}" alt="${enemy.name}"
        onerror="this.onerror=null;this.src='${enemy.fallback}'"
        style="align-self:flex-start;${enemy.hp<=0?'filter:grayscale(1) brightness(.4);opacity:.5;':''}">
    </div>

    <!-- Jugador (abajo izquierda) -->
    <div style="display:flex;align-items:flex-end;gap:12px;padding:0 4px;">
      <img class="fighter-sprite"
        src="${player.src}" alt="${player.name}"
        onerror="this.onerror=null;this.src='${player.fallback}'"
        style="${player.hp<=0?'filter:grayscale(1) brightness(.4);':''}">
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
        <div style="display:flex;align-items:center;gap:5px;">
          <span style="color:#f5c842;font-size:5px;">${player.name}</span>
          <span style="color:#88aadd;font-size:4px;">Nv.${player.level}</span>
        </div>
        <div style="display:flex;gap:3px;flex-wrap:wrap;">${player.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('')}</div>
        <div style="width:100%;height:6px;background:#1a1a3a;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.1);">
          <div style="width:${playerHpPct}%;height:100%;background:${playerCol};border-radius:3px;transition:width .5s;"></div>
        </div>
        <span style="color:#aac8ff;font-size:4px;">PS: ${Math.max(0,player.hp)}/${player.maxHp}</span>
      </div>
    </div>

    <div class="battle-log" id="battle-log">${logHtml}</div>
    <div class="battle-actions" id="battle-actions"></div>
  `;

  renderActions();

function renderActions(){
  const cs = combatState;
  if(!cs) return;
  const actions = document.getElementById('battle-actions');
  const enemy   = currentEnemy();
  const player  = cs.playerPoke;
  const isGym   = cs.type === 'gym';

  if(cs.phase === 'victory'){
    const nextBtn = isGym
      ? (cs.enemyIdx < cs.enemyQueue.length - 1
          ? `<button class="ba-btn next gym" onclick="nextGymPokemon()">SIGUIENTE PKM ▶</button>`
          : `<button class="ba-btn next gym" onclick="victoryGym()">🏅 RECIBIR MEDALLA</button>`)
      : `<button class="ba-btn next" onclick="endCombat(true)">SIGUIENTE DÍA ▶</button>`;
    actions.innerHTML = nextBtn;
    return;
  }

  if(cs.phase === 'defeat'){
    actions.innerHTML = `<button class="ba-btn run" onclick="endCombat(false)">😵 ESCAPAR</button>`;
    return;
  }

  if(cs.phase === 'caught'){
    actions.innerHTML = `<button class="ba-btn next" onclick="endCombat(true)">¡CAPTURADO! SIGUIENTE DÍA ▶</button>`;
    return;
  }

  // Fase de combate normal
  const canAttack = player.hp > 0 && enemy.hp > 0;
  const canCapture = cs.type === 'wild' && enemy.hp <= Math.ceil(enemy.maxHp * 0.4) && enemy.hp > 0;

  actions.innerHTML = `
    <button class="ba-btn attack" ${!canAttack?'disabled':''} onclick="playerAttack()">⚔️ ATACAR</button>
    ${cs.type === 'wild' ? `<button class="ba-btn ball" ${!canCapture?'disabled':''} onclick="throwBall()" title="${canCapture?'Lanza la Poké Ball':'Debilita más al rival para capturarlo'}">🔵 POKÉ BALL${!canCapture?' (PS altos)':''}</button>` : ''}
    <button class="ba-btn run" onclick="flee()">🏃 HUIR</button>
  `;
}

function log(text, cls=''){
  if(!combatState) return;
  combatState.log.push({text, cls});
  const el = document.getElementById('battle-log');
  if(el){
    el.innerHTML = combatState.log.slice(-4).map(l=>`<p class="${l.cls||''}">${l.text}</p>`).join('');
    el.scrollTop = el.scrollHeight;
  }
}

function calcDamage(atkLevel, defLevel, bonus=1){
  const base = Math.floor((atkLevel * 0.8 + 5) * bonus);
  return Math.max(1, base + Math.floor(Math.random() * base * 0.3) - Math.floor(base * 0.15));
}

async function playerAttack(){
  const cs = combatState;
  if(!cs || cs.phase !== 'fighting') return;
  disableActions();

  const enemy  = currentEnemy();
  const player = cs.playerPoke;
  const move   = player.moves ? player.moves[Math.floor(Math.random()*player.moves.length)] : 'Ataque';
  const dmg    = calcDamage(player.level, enemy.level);

  enemy.hp = Math.max(0, enemy.hp - dmg);
  log(`${player.name} usó ${move}!`);
  await sleep(600);
  log(`¡${enemy.name} recibió ${dmg} de daño!`, 'highlight');
  renderCombat();
  await sleep(500);

  if(enemy.hp <= 0){
    log(`¡${enemy.name} fue debilitado!`, 'green');
    await sleep(400);
    cs.phase = 'victory';
    renderCombat();
    if(cs.type === 'gym' && cs.enemyIdx < cs.enemyQueue.length - 1){
      log(`¡${cs.leader.name} saca otro Pokémon!`,'highlight');
    }
    return;
  }

  // Contraataque enemigo
  await enemyAttack();
}

async function enemyAttack(){
  const cs = combatState;
  if(!cs || cs.phase !== 'fighting') return;
  const enemy  = currentEnemy();
  const player = cs.playerPoke;

  if(enemy.hp <= 0) return;

  const move = (enemy.moves && enemy.moves.length)
    ? enemy.moves[Math.floor(Math.random()*enemy.moves.length)]
    : 'Ataque';
  const dmg = calcDamage(enemy.level, player.level);

  await sleep(300);
  log(`${enemy.name} usó ${move}!`);
  await sleep(500);
  player.hp = Math.max(0, player.hp - dmg);
  log(`¡${player.name} recibió ${dmg} de daño!`, 'red');
  refreshTeam();
  renderCombat();
  await sleep(400);

  if(player.hp <= 0){
    log(`¡${player.name} fue debilitado!`, 'red');
    await sleep(400);
    // Buscar otro pokemon vivo
    const next = TEAM.find(p => p !== player && p.hp > 0);
    if(next){
      cs.playerPoke = next;
      log(`¡Aritz sacó a ${next.name}!`, 'highlight');
      await sleep(400);
      renderCombat();
    } else {
      cs.phase = 'defeat';
      log(`¡Todos tus Pokémon han sido debilitados!`, 'red');
      // Romper racha
      const s = getState();
      s.streak = 0;
      saveState(s);
      updateStreakDisplay();
      renderCombat();
    }
  }
}

async function throwBall(){
  const cs = combatState;
  if(!cs || cs.type !== 'wild' || cs.phase !== 'fighting') return;
  const enemy = cs.enemy;
  disableActions();

  cs.ballsUsed++;
  log(`¡Aritz lanzó una Poké Ball!`, 'highlight');
  await sleep(700);

  // Tasa de captura basada en HP
  const hpPct    = enemy.hp / enemy.maxHp;
  const catchRate = hpPct < 0.15 ? 0.9 : hpPct < 0.3 ? 0.7 : 0.5;
  const caught    = Math.random() < catchRate;

  // Animación wobble
  const spr = document.getElementById('enemy-sprite');
  if(spr){ spr.classList.add('shaking'); await sleep(600); spr.classList.remove('shaking'); }

  if(caught){
    enemy.hp = 0;
    enemy.caught = true;
    cs.phase = 'caught';
    const shinyStr = enemy.shiny ? '✨ ¡SHINY! ' : '';
    log(`¡${shinyStr}${enemy.name} fue capturado!`, enemy.shiny ? 'shiny' : 'green');
    await sleep(300);
    log(`¡${enemy.name} añadido a tu PC!`, 'green');
    // Añadir al PC (caja 5 de capturados)
    addCapturedToPC(enemy);
    renderCombat();
  } else {
    const escapeMsgs = ['¡Oh! El Pokémon escapó.', '¡Casi lo tienes!', '¡La Poké Ball se abrió!'];
    log(escapeMsgs[Math.floor(Math.random()*escapeMsgs.length)]);
    await sleep(400);
    // Contraataque tras escape
    await enemyAttack();
  }
}

function addCapturedToPC(enemy){
  try {
    const s = getState();
    if(!s.captured) s.captured = [];
    s.captured.push({
      id: enemy.id, name: enemy.name, types: enemy.types,
      level: enemy.level, shiny: enemy.shiny,
      caughtOn: todayStr(),
    });
    saveState(s);
  } catch {}
}

const MOVE_API = {
  "Cascada":"waterfall","Puño Hielo":"ice-punch","Terremoto":"earthquake","Relajo":"slack-off",
  "Drenadoras":"leech-seed","Tóxico":"toxic","Protección":"protect","Energibola":"energy-ball",
  "Trueno":"thunder","Red Viscosa":"sticky-web","Zumbido":"bug-buzz","Electrotela":"electroweb",
  "Martillo Coloso":"gigaton-hammer","Carantoña":"play-rough","Danza Espada":"swords-dance",
  "Sorpresa":"sucker-punch","Fuego Fatuo":"will-o-wisp","Lanzallamas":"flamethrower",
  "Bola Sombra":"shadow-ball","Paz Mental":"calm-mind","A Bocajarro":"superpower",
  "Psicocorte":"psycho-cut","Desarme":"knock-off","Avalancha":"avalanche",
};
const MOVE_CACHE = {};

async function fetchMove(nameEs){
  if(MOVE_CACHE[nameEs]) return MOVE_CACHE[nameEs];
  const slug = MOVE_API[nameEs];
  if(!slug) return {pp:'?',type:'normal'};
  try {
    const res  = await fetch(`https://pokeapi.co/api/v2/move/${slug}`);
    const data = await res.json();
    const info = {pp:data.pp, type:data.type.name};
    MOVE_CACHE[nameEs] = info;
    return info;
  } catch { return {pp:'?',type:'normal'}; }
}

const overlay = document.getElementById('modal-overlay');
let currentModalPoke = null;

function updateModalHp(){
  const p = currentModalPoke;
  if(!p||!p.maxHp) return;
  const pct = Math.max(0, p.hp/p.maxHp*100);
  document.getElementById('modal-hp-bar').style.width = pct+'%';
  document.getElementById('modal-hp-bar').style.background = hpColor2(p.hp,p.maxHp);
  document.getElementById('modal-hp-text').textContent = p.hp<=0?'¡DEBILITADO!':`PS: ${p.hp} / ${p.maxHp}`;
}
function dealDamage(dmg){
  const p=currentModalPoke; if(!p||!p.maxHp||p.hp<=0) return;
  p.hp=Math.max(0,p.hp-dmg); updateModalHp(); refreshTeam();
}

async function openModal(p){
  currentModalPoke = p;
  document.getElementById('modal-sprite').src = p.src;
  document.getElementById('modal-name').textContent = `${p.name}  Nv.${p.level}`;
  document.getElementById('modal-types').innerHTML  = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  document.getElementById('modal-ability').textContent = p.ability||'—';
  document.getElementById('modal-item').textContent    = p.item||'—';
  updateModalHp();
  overlay.classList.add('open');
  const grid = document.getElementById('modal-moves');
  if(!p.moves||!p.moves.length){ grid.innerHTML='<span style="color:#555;font-size:6px;">Sin movimientos</span>'; return; }
  grid.innerHTML = p.moves.map(m=>`
    <div class="move-pill" id="mp-${m.replace(/[\s'✨]/g,'_')}">
      <div class="move-type-badge t-normal">···</div>
      <span class="move-name">${m}</span>
      <span class="move-pp">PP: …</span>
    </div>`).join('');
  await Promise.all(p.moves.map(async m=>{
    const info=await fetchMove(m);
    const el=document.getElementById(`mp-${m.replace(/[\s'✨]/g,'_')}`);
    if(!el) return;
    el.querySelector('.move-type-badge').className=`move-type-badge t-${info.type}`;
    el.querySelector('.move-type-badge').textContent=info.type.toUpperCase();
    el.querySelector('.move-pp').textContent=`PP: ${info.pp}`;
  }));
}

document.getElementById('modal-close').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open');});

function hpColor(p){ return hpColor2(p.hp,p.maxHp); }

function buildSlot(p){
  const fainted = p.hp<=0;
  const div = document.createElement('div');
  div.className = 'slot'+(fainted?' fainted':'');
  if(fainted){ const fl=document.createElement('div'); fl.className='fainted-label'; fl.textContent='FIN'; div.appendChild(fl); }
  const img=document.createElement('img');
  img.alt=p.name||'?';
  img.style.cssText='width:clamp(80px,11vw,140px);height:clamp(80px,11vw,140px);object-fit:contain;image-rendering:pixelated;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));';
  if(fainted) img.style.filter='grayscale(1) brightness(.55)';
  img.src=p.src||''; img.onerror=()=>{img.onerror=null;img.src=p.fallback||`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id||1}.png`;};
  div.appendChild(img);
  const nm=document.createElement('span'); nm.className='pname'; nm.textContent=p.name||'???'; div.appendChild(nm);
  const lv=document.createElement('span'); lv.className='plv'; lv.textContent=`Nv.${p.level||50}`; div.appendChild(lv);
  const ty=document.createElement('div'); ty.className='types'; ty.innerHTML=(p.types||['normal']).map(t=>`<span class="tb t-${t}">${t}</span>`).join(''); div.appendChild(ty);
  if(p.maxHp){
    const pct=Math.max(0,p.hp/p.maxHp*100);
    const wrap=document.createElement('div'); wrap.className='hp-bar-wrap';
    const bar=document.createElement('div'); bar.className='hp-bar';
    bar.style.width=pct+'%'; bar.style.background=hpColor(p); wrap.appendChild(bar); div.appendChild(wrap);
    const ht=document.createElement('span'); ht.className='hp-text';
    ht.textContent=fainted?'¡DEBILITADO!':`PS: ${p.hp}/${p.maxHp}`; div.appendChild(ht);
  }
  div.addEventListener('click',()=>openModal(p));
  return div;
}

function refreshTeam(){
  const grid=document.getElementById('team-grid'); if(!grid) return;
  grid.innerHTML=''; TEAM.forEach(p=>grid.appendChild(buildSlot(p)));
}

    const nm=document.createElement('span');
    nm.textContent=p.name;
    nm.style.cssText=`color:${p.shiny?'#ffdd55':'#aabbff'};font-size:4.5px;margin-top:3px;text-align:center;`;
    if(p.caughtOn){ const d=document.createElement('span'); d.textContent=p.caughtOn; d.style.cssText='color:#557733;font-size:3.5px;margin-top:1px;'; slot.appendChild(img); slot.appendChild(nm); slot.appendChild(d); }
    else { slot.appendChild(img); slot.appendChild(nm); }
    grid.appendChild(slot);
  });
}

// ══════════════════════════════════════════════════════════
//  BOLSA
// ══════════════════════════════════════════════════════════
const BAG_ITEMS={
  "POCIONES":[
    {name:"Poción",       img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/potion.png",       heal:20},
    {name:"Super Poción", img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/super-potion.png", heal:50},
    {name:"Hiper Poción", img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/hyper-potion.png", heal:120},
    {name:"Poción Máx.",  img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/max-potion.png",   heal:0},
    {name:"Cura Total",   img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/full-restore.png", heal:0},
    {name:"Revivir",      img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/revive.png",       revive:true,heal:0,halfHp:true},
    {name:"Max Revivir",  img:"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/max-revive.png",   revive:true,heal:0,halfHp:false},
  ],
};
let bagOpen=false, bagCat=0;
const BAG_CATS=Object.keys(BAG_ITEMS);

function healPoke(p,amount,revive=false){
  if(!p||!p.maxHp) return false;
  if(p.hp<=0&&!revive) return false;
  if(p.hp>=p.maxHp) return false;
  p.hp=amount===0?p.maxHp:Math.min(p.maxHp,p.hp+amount);
  return true;
}
function revivePoke(p,halfHp=true){
  if(!p||!p.maxHp||p.hp>0) return false;
  p.hp=halfHp?Math.floor(p.maxHp/2):p.maxHp; return true;
}

function buildBag(){
  const btn=document.createElement('button');
  btn.id='bag-btn';
  btn.innerHTML='🎒 BOLSA';
  btn.style.cssText='position:fixed;bottom:24px;right:140px;z-index:200;background:#0d1244;border:3px solid #f5c842;border-radius:6px;color:#f5c842;font-family:\'Press Start 2P\',monospace;font-size:9px;padding:10px 16px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5);transition:background .15s;letter-spacing:1px;';
  btn.onmouseover=()=>btn.style.background='#1a2fa8';
  btn.onmouseout=()=>btn.style.background='#0d1244';
  btn.onclick=toggleBag;
  document.body.appendChild(btn);

  const win=document.createElement('div');
  win.id='bag-window';
  win.style.cssText='position:fixed;bottom:76px;right:140px;z-index:199;width:340px;background:#0a0e2a;border:4px solid #f5c842;border-radius:8px;box-shadow:0 0 0 2px #000,6px 6px 0 rgba(0,0,0,.7);font-family:\'Press Start 2P\',monospace;display:none;overflow:hidden;';
  win.innerHTML=`
    <div style="background:#060e33;border-bottom:3px solid #f5c842;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="color:#f5c842;font-size:8px;">🎒 BOLSA</span>
      <button onclick="toggleBag()" style="background:#cc2222;border:none;color:#fff;font-family:'Press Start 2P',monospace;font-size:7px;padding:4px 8px;border-radius:3px;cursor:pointer;">✕</button>
    </div>
    <div id="bag-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;background:#0a0e2a;"></div>
    <div id="bag-info" style="border-top:2px solid #1a2a66;padding:8px 12px;min-height:36px;background:#080e28;font-size:6px;color:#444;">Selecciona una poción</div>
  `;
  document.body.appendChild(win);
  renderBag();
}

function toggleBag(){ bagOpen=!bagOpen; document.getElementById('bag-window').style.display=bagOpen?'block':'none'; }

function renderBag(){
  const grid=document.getElementById('bag-grid'); grid.innerHTML='';
  const items=BAG_ITEMS[BAG_CATS[bagCat]];
  items.forEach(item=>{
    const slot=document.createElement('div');
    slot.style.cssText='background:#0d1744;border:2px solid #2266cc;border-radius:5px;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;transition:border-color .15s,transform .15s;';
    slot.onmouseover=()=>{slot.style.borderColor='#f5c842';slot.style.transform='translateY(-2px)';};
    slot.onmouseout=()=>{slot.style.borderColor='#2266cc';slot.style.transform='';};
    slot.addEventListener('click',()=>showTeamPicker(item));
    const img=document.createElement('img'); img.src=item.img; img.style.cssText='width:44px;height:44px;object-fit:contain;image-rendering:pixelated;';
    const nm=document.createElement('span'); nm.textContent=item.name; nm.style.cssText='color:#aabbff;font-size:4.5px;margin-top:3px;text-align:center;line-height:1.3;';
    slot.appendChild(img); slot.appendChild(nm); grid.appendChild(slot);
  });
}

function showTeamPicker(item){
  const grid=document.getElementById('bag-grid'); grid.innerHTML='';
  document.getElementById('bag-info').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;"><span style="color:#f5c842;font-size:6px;">¿A quién usar ${item.name}?</span><button onclick="renderBag()" style="background:#333;border:none;color:#aaa;font-family:'Press Start 2P',monospace;font-size:5px;padding:3px 6px;border-radius:3px;cursor:pointer;">◀</button></div>`;
  TEAM.forEach(p=>{
    const fainted=p.hp<=0;
    const canTarget=item.revive?fainted:(!fainted&&p.hp<p.maxHp);
    const slot=document.createElement('div');
    slot.style.cssText=`background:${canTarget?'#0d1744':'#0a0a1a'};border:2px solid ${canTarget?'#2266cc':'#222'};border-radius:5px;display:flex;flex-direction:column;align-items:center;padding:6px 4px;cursor:${canTarget?'pointer':'not-allowed'};opacity:${canTarget?1:.4};transition:border-color .15s;`;
    if(canTarget){ slot.onmouseover=()=>slot.style.borderColor='#f5c842'; slot.onmouseout=()=>slot.style.borderColor='#2266cc'; slot.addEventListener('click',()=>{ const ok=item.revive?revivePoke(p,item.halfHp):healPoke(p,item.heal); if(ok){ document.getElementById('bag-info').innerHTML=`<span style="color:#aaffaa;font-size:6px;">✔ ${item.name} usado en ${p.name}! PS: ${p.hp}/${p.maxHp}</span>`; refreshTeam(); if(currentModalPoke===p) updateModalHp(); setTimeout(renderBag,1200); } }); }
    const img=document.createElement('img'); img.src=p.src; img.onerror=()=>{img.onerror=null;img.src=p.fallback;}; img.style.cssText=`width:44px;height:44px;object-fit:contain;image-rendering:pixelated;${fainted?'filter:grayscale(1) brightness(.5);':''}`;
    const nm=document.createElement('span'); nm.textContent=p.name; nm.style.cssText='color:#aabbff;font-size:4px;margin-top:3px;text-align:center;';
    const hp=document.createElement('span'); hp.textContent=fainted?'¡FIN!':`${p.hp}/${p.maxHp}`; hp.style.cssText=`color:${fainted?'#cc2222':'#f5c842'};font-size:4px;margin-top:1px;`;
    slot.appendChild(img); slot.appendChild(nm); slot.appendChild(hp); grid.appendChild(slot);
  });
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
function initApp(){
  refreshTeam();
  updateClock();
  setInterval(updateClock,1000);
  updateStreakDisplay();
  buildPC();
  buildBag();

  // Si ya combatió hoy y abre la ventana, mostrar pantalla de espera
  if(hasCompletedToday()){
    // El botón ya se actualiza en updateStreakDisplay
  }
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initApp);
else initApp();
</script>
