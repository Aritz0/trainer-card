<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Card – Aritz</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1244;--blue:#1a2fa8;
  --gold:#f5c842;--red:#cc2222;--green:#7cb836;
  --pixel:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--green);
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);
  font-family:var(--pixel);padding:20px;
}
.card{
  width:480px;
  background:var(--blue);
  border:4px solid var(--gold);border-radius:8px;
  box-shadow:0 0 0 2px #000,8px 8px 0 rgba(0,0,0,.5);
  overflow:hidden;
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes cardIn{from{transform:scale(.85) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card-header{
  background:var(--navy);border-bottom:3px solid var(--gold);
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;
}
.card-header .lbl{color:var(--gold);font-size:7.5px;letter-spacing:1.5px}
.card-header .num{color:#8899ff;font-size:7px}
.card-body{display:grid;grid-template-columns:160px 1fr}
.left{
  background:linear-gradient(160deg,#1833bb,#0a1266);
  border-right:3px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 8px 10px;gap:10px;
}
.avatar-frame{
  width:128px;height:128px;
  border:3px solid var(--gold);border-radius:5px;
  background:#0e1a77;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
/* Si metes una <img> dentro de .avatar-frame, se ajusta sola */
.avatar-frame img{width:100%;height:100%;object-fit:contain;object-position:center}
.avatar-frame svg{width:100%;height:100%}
.stats{width:100%}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);
  padding:4px 2px;font-size:5.5px;
}
.stat-row .k{color:#99aadd}
.stat-row .v{color:#fff}
.stat-row .v.gold{color:var(--gold)}
.right{padding:11px 10px 12px;display:flex;flex-direction:column;gap:9px}
.team-lbl{
  color:var(--gold);font-size:6.5px;letter-spacing:1px;
  display:flex;align-items:center;gap:5px;
}
.team-lbl::before{content:'▶';color:#fff;font-size:5px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{
  background:#0a1d44;border:2px solid #1e44aa;border-radius:4px;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 4px 5px;cursor:pointer;position:relative;
  transition:border-color .15s,transform .15s,background .15s;
}
.slot:hover{border-color:var(--gold);background:#142a66;transform:translateY(-4px)}
.slot img{
  width:76px;height:76px;object-fit:contain;
  image-rendering:pixelated;display:block;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));
}
.slot .pname{color:#cce0ff;font-size:4.8px;text-align:center;margin-top:3px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.slot .plv{color:#88aadd;font-size:4.2px;margin-top:1px}
.types{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center}
.tb{font-size:4px;padding:1px 3px;border-radius:2px;color:#fff;text-transform:uppercase;letter-spacing:.3px}
.t-water{background:#3a7eee}.t-grass{background:#3da820}.t-ground{background:#b07a30}
.t-fire{background:#e85010}.t-ice{background:#3dbcbc}.t-electric{background:#c8a800}
.t-bug{background:#7a9a10}.t-rock{background:#887832}.t-ghost{background:#5c3a88}
.t-poison{background:#882288}.t-steel{background:#7a8fa0}.t-fairy{background:#cc5599}
.t-dark{background:#3a3a44}.t-flying{background:#6688cc}.t-fighting{background:#8a3010}
.t-psychic{background:#cc2255}.t-dragon{background:#4418d8}.t-normal{background:#7a7a66}
.tip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#05051a;color:#dde8ff;font-family:var(--vt);font-size:14px;
  padding:7px 10px;border-radius:3px;border:1px solid var(--gold);
  white-space:nowrap;z-index:99;pointer-events:none;
  opacity:0;transition:opacity .15s;text-align:center;line-height:1.6;
}
.slot:hover .tip{opacity:1}
.card-footer{
  background:var(--navy);border-top:3px solid var(--gold);
  padding:7px 14px;display:flex;justify-content:space-between;align-items:center;
}
.card-footer .ftag{color:#8899ff;font-size:5.5px;letter-spacing:.5px}
.card-footer .fid{color:var(--gold);font-size:5.5px}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <span class="lbl">✦ TRAINER CARD</span>
    <span class="num">Nº 001</span>
  </div>
  <div class="card-body">

    <!-- LEFT -->
    <div class="left">

      <div class="avatar-frame">
            <img src="ghetsis-pokemon.gif" alt="Aritz">
      </div>

      <div class="stats">
        <div class="stat-row"><span class="k">NOMBRE</span><span class="v gold">ARITZ</span></div>
        <div class="stat-row"><span class="k">REGION</span><span class="v">BASAURI</span></div>
        <div class="stat-row"><span class="k">JUEGO</span><span class="v gold">POKÉMON</span></div>
        <div class="stat-row"><span class="k">HORA</span><span class="v" id="st-hours">--:--</span></div>
        <div class="stat-row"><span class="k">DÍA</span><span class="v" id="st-day">---</span></div>
        <div class="stat-row"><span class="k">ID Nº</span><span class="v">00001</span></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="team-lbl">EQUIPO ACTUAL</div>
      <div class="team-grid" id="team-grid"></div>
    </div>

  </div>
  <div class="card-footer">
    <span class="ftag">POKÉMON · BASAURI</span>
    <span class="fid">★ ARITZ ★</span>
  </div>
</div>

<script>
// ── EQUIPO ──────────────────────────────────────────────
const TEAM = [
  { name:"SWAMPERT",        id:260,  types:["water","ground"],  level:50 },
  { name:"ROSERADE",        id:407,  types:["grass","poison"],  level:50 },
  { name:"GALVANTULA",      id:596,  types:["bug","electric"],  level:50 },
  { name:"TINKATON",        id:959,  types:["fairy","steel"],   level:50 },
  // Chandelure – la Mega no tiene sprite en PokeAPI, se usa el normal
  { name:"MEGA CHANDELURE", id:609,  types:["ghost","fire"],    level:50 },
  { name:"MALAMAR",         id:687,  types:["dark","psychic"],  level:50 },
];

// ── RENDERIZAR SLOTS DE POKÉMON ─────────────────────────
function buildSlot(p){
  const div = document.createElement('div');
  div.className = 'slot';

  // Tooltip al hover
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.innerHTML = `${p.name}<br>${p.types.map(t=>t.toUpperCase()).join(' / ')}<br>Nv.${p.level}`;
  div.appendChild(tip);

  // Imagen – Home sprite (fondo transparente, mismo estilo para todos)
  const img = document.createElement('img');
  img.alt   = p.name;
  img.width = 76;
  img.height= 76;
  img.src   = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${p.id}.png`;
  // Fallback: sprite clásico si Home no existe
  img.onerror = () => {
    img.onerror = null;
    img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
  };
  div.appendChild(img);

  // Nombre
  const nm = document.createElement('span');
  nm.className = 'pname';
  nm.textContent = p.name;
  div.appendChild(nm);

  // Nivel
  const lv = document.createElement('span');
  lv.className = 'plv';
  lv.textContent = `Nv.${p.level}`;
  div.appendChild(lv);

  // Tipos
  const ty = document.createElement('div');
  ty.className = 'types';
  ty.innerHTML = p.types.map(t=>`<span class="tb t-${t}">${t}</span>`).join('');
  div.appendChild(ty);

  return div;
}

// ── RELOJ EN TIEMPO REAL ────────────────────────────────
const DIAS = ['DOM','LUN','MAR','MIE','JUE','VIE','SÁB'];

function updateClock(){
  const now  = new Date();
  const h    = String(now.getHours()).padStart(2,'0');
  const m    = String(now.getMinutes()).padStart(2,'0');
  const s    = String(now.getSeconds()).padStart(2,'0');
  const dia  = DIAS[now.getDay()];
  const dd   = String(now.getDate()).padStart(2,'0');
  const mm   = String(now.getMonth()+1).padStart(2,'0');
  const yyyy = now.getFullYear();

  document.getElementById('st-hours').textContent = `${h}:${m}:${s}`;
  document.getElementById('st-day').textContent   = `${dia} ${dd}/${mm}/${yyyy}`;
}

// ── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Renderizar equipo
  const grid = document.getElementById('team-grid');
  TEAM.forEach(p => grid.appendChild(buildSlot(p)));

  // Reloj actualizado cada segundo
  updateClock();
  setInterval(updateClock, 1000);
});
</script>
</body>
</html>
