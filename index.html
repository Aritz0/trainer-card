<!DOCTYPE html>

<head>

<style>

/* =========================
ESTILO ORIGINAL MEJORADO
========================= */

body{
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),
url('https://images.alphacoders.com/677/677583.png');

}

header{

}

.card{

}

.pokemon-card{

transition:.25s;

overflow:hidden;
}

.pokemon-card:hover{

box-shadow:0 0 25px rgba(80,120,255,.45);
}

.pokemon-card::before{
content:'';

inset:0;
background:linear-gradient(transparent,rgba(255,255,255,.05));

.top-btn{

}

.top-btn:hover{
transform:scale(1.06);
background:linear-gradient(180deg,#4b73ff,#2c43bb);
}

.modal{
background:rgba(10,18,45,.97);
backdrop-filter:blur(10px);
box-shadow:0 0 35px rgba(0,0,0,.8);
}

#combat-window{
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.7)),
url('https://wallpapercave.com/wp/wp3741670.png');
background-size:cover;
background-position:center;
}

.friend-card{
background:#132252;
padding:10px;
border-radius:10px;
border:2px solid #355dff;
margin-bottom:10px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'VT323',monospace;
}

body{
background:#081226;
color:white;
overflow-x:hidden;
}

header{
background:#0f1d44;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:4px solid #f5c842;
}

h1{
font-size:42px;
color:#f5c842;
}

button{
cursor:pointer;
border:none;
}

.top-btn{

color:white;

border-radius:10px;

}

.container{
padding:20px;
}

.card{

border:3px solid #2244aa;
border-radius:15px;

}

.grid{

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

.pokemon-card{

}

.bar{

}

.fill{

background:#44ff88;
}

.modal-overlay{

inset:0;
background:rgba(0,0,0,.8);

justify-content:center;

}

.modal-overlay.open{
display:flex;
}

.modal{
background:#0f1d44;
border:4px solid #44ff88;

}

input,select{
width:100%;

top:50%;

}

.combat-area{

<body>

<header>
<h1>POKÉMON MMORPG</h1>
<div>
<button class="top-btn" onclick="openBag()">🎒 Mochila</button>
<button class="top-btn" onclick="openShop()">🛒 Tienda</button>
<button class="top-btn" onclick="searchWildPokemon()">🌿 Buscar Pokémon</button>
</div>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h2 style="color:#f5c842;">👤 TARJETA ENTRENADOR</h2>

</div>

<div class="card">
<h2 style="color:#44ff88;">👥 AMIGOS</h2>
<div id="friends-list"></div>
<input type="text" id="friend-input" placeholder="Añadir amigo">
<button class="auth-btn" onclick="addFriend()">Añadir amigo</button>
</div>

</div>

<div class="card">
<h2 id="trainer-name">Entrenador</h2>
<p>💰 <span id="money-view">10000 ₽</span></p>
<p>🏅 Medallas: <span id="badge-view">0</span>/8</p>
</div>

<div class="grid" id="team-grid"></div>

</div>

<div class="modal-overlay open" id="register-modal">
<div class="modal">
<h2>Registro Pokémon</h2>
<input type="text" id="username" placeholder="Nombre entrenador">

<div style="margin-top:20px;">
<h3>Elige inicial</h3>
<div class="grid">
<div class="starter-choice" onclick="chooseStarter(1)">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/1.gif">
<div>Bulbasaur</div>
</div>

<div class="starter-choice" onclick="chooseStarter(4)">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/4.gif">
<div>Charmander</div>
</div>

<div class="starter-choice" onclick="chooseStarter(7)">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/7.gif">
<div>Squirtle</div>
</div>
</div>
</div>

<button class="auth-btn" onclick="register()">COMENZAR</button>
</div>
</div>

<div class="modal-overlay" id="bag-modal">
<div class="modal">
<h2>🎒 Mochila</h2>
<div id="bag-body"></div>
<button class="auth-btn" onclick="closeBag()">Cerrar</button>
</div>
</div>

<div class="modal-overlay" id="shop-modal">
<div class="modal">
<h2>🛒 PokéMart</h2>
<div id="shop-body"></div>
<button class="auth-btn" onclick="closeShop()">Cerrar</button>
</div>
</div>

<div id="combat-window"></div>

<script>

let selectedStarter=1;
let currentUser=null;
let enemyPokemon=null;

const SHOP_ITEMS={
pokeball:200,
superball:600,
ultraball:1200,
potion:300,
superPotion:700,
hyperPotion:1200,
revive:1500
};

const MOVEDEX={
Placaje:{power:40,type:'normal',category:'physical'},
Lanzallamas:{power:90,type:'fire',category:'special'},
PistolaAgua:{power:40,type:'water',category:'special'},
HojaAfilada:{power:55,type:'grass',category:'physical'},
Gigadrenado:{power:75,type:'grass',category:'special',heal:true},
Toxico:{power:0,type:'poison',category:'status',status:'poison'}
};

const EVOLUTIONS={
1:{level:16,to:2},
2:{level:32,to:3},
4:{level:16,to:5},
5:{level:36,to:6},
7:{level:16,to:8},
8:{level:36,to:9}
};

const POKEDEX=[
{id:16,name:'Pidgey',rarity:'common'},
{id:19,name:'Rattata',rarity:'common'},
{id:25,name:'Pikachu',rarity:'rare'},
{id:133,name:'Eevee',rarity:'rare'},
{id:150,name:'Mewtwo',rarity:'legendary'}
];

function chooseStarter(id){
selectedStarter=id;
}

function getSpr(id){
return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${id}.gif`;
}

function getStarterPokemon(id){
const map={
1:{name:'Bulbasaur',types:['grass']},
4:{name:'Charmander',types:['fire']},
7:{name:'Squirtle',types:['water']}
};

return {
id,
name:map[id].name,
level:5,
exp:0,
maxExp:100,
hp:22,
maxHp:22,
attack:10,
defense:10,
spAttack:10,
spDefense:10,
speed:10,
status:null,
src:getSpr(id),
moves:[
{name:'Placaje',power:40,category:'physical'},
{name:'Gigadrenado',power:75,category:'special',heal:true}
]
};
}

function register(){
const username=document.getElementById('username').value;

currentUser={
friends:[],
name:username,
money:10000,
badges:0,
inventory:{
pokeball:10,
potion:5,
superball:0,
ultraball:0
},
team:[getStarterPokemon(selectedStarter)],
dailyCaptures:0,
dailyTrainerBattles:0
};

localStorage.setItem('pokemonUser',JSON.stringify(currentUser));

document.getElementById('register-modal').classList.remove('open');

renderUI();
}

function renderUI(){

renderFriends();
const u=currentUser;

if(!u) return;

document.getElementById('trainer-name').textContent=u.name;

const profile=document.getElementById('trainer-profile');

profile.innerHTML=`
<div>🏆 ${u.name}</div>
<div>💰 ${u.money} ₽</div>
<div>🎒 Poké Balls: ${u.inventory.pokeball}</div>
<div>🏅 Medallas: ${u.badges}</div>
<div>📍 Zona: ${CURRENT_ZONE.name}</div>
<div>📖 Pokédex: ${getCapturedCount()} capturados</div>
`;
document.getElementById('money-view').textContent=u.money+' ₽';
document.getElementById('badge-view').textContent=u.badges;

let html='';

u.team.forEach((p,index)=>{
html+=`
<div class="pokemon-card">
<img src="${p.src}">
<h2>${p.name}</h2>
<p>Nv ${p.level}</p>
<div class="bar"><div class="fill" style="width:${(p.hp/p.maxHp)*100}%"></div></div>
<p>${p.hp}/${p.maxHp} HP</p>
<p>⚔️ ${p.attack} | 🛡️ ${p.defense}</p>
<p>✨ ${p.spAttack} | 🔰 ${p.spDefense}</p>
<p>⚡ ${p.speed}</p>
<p>${p.moves.map(m=>m.name).join(', ')}</p>
</div>`;
});

document.getElementById('team-grid').innerHTML=html;
}

function openBag(){
const u=currentUser;
let html='';

Object.keys(u.inventory).forEach(item=>{
html+=`<div class="card">${item} x${u.inventory[item]}</div>`;
});

document.getElementById('bag-body').innerHTML=html;
document.getElementById('bag-modal').classList.add('open');
}

function closeBag(){
document.getElementById('bag-modal').classList.remove('open');
}

function openShop(){
let html='';

Object.keys(SHOP_ITEMS).forEach(item=>{
html+=`
<div class="card">
<h3>${item}</h3>
<p>${SHOP_ITEMS[item]} ₽</p>
<button class="auth-btn" onclick="buyItem('${item}')">Comprar</button>
</div>`;
});

document.getElementById('shop-body').innerHTML=html;
document.getElementById('shop-modal').classList.add('open');
}

function closeShop(){
document.getElementById('shop-modal').classList.remove('open');
}

function buyItem(item){
const price=SHOP_ITEMS[item];

if(currentUser.money<price){
alert('No tienes dinero suficiente');
return;
}

currentUser.money-=price;
currentUser.inventory[item]++;

save();
renderUI();
openShop();
}

function save(){
localStorage.setItem('pokemonUser',JSON.stringify(currentUser));
}

function searchWildPokemon(){

if(currentUser.dailyCaptures>=1){
alert('Solo puedes capturar 1 Pokémon al día');
return;
}

const random=POKEDEX[Math.floor(Math.random()*POKEDEX.length)];

enemyPokemon={
id:random.id,
name:random.name,
rarity:random.rarity,
level:Math.floor(Math.random()*10)+3,
hp:40,
maxHp:40,
attack:12,
defense:10,
spAttack:10,
spDefense:10,
speed:10,
src:getSpr(random.id),
status:null,
moves:[
{name:'Placaje',power:40,category:'physical'}
]
};

openCombat();
}

function openCombat(){

const player=currentUser.team[0];

const html=`
<h1 style="text-align:center;color:#f5c842;">COMBATE POKÉMON</h1>

<div class="combat-area">

<div class="combat-side">
<h2>${player.name}</h2>
<img src="${player.src}" width="200">
<p>HP ${player.hp}/${player.maxHp}</p>
<div class="bar"><div class="fill" style="width:${(player.hp/player.maxHp)*100}%"></div></div>
</div>

<div class="combat-side">
<h2>${enemyPokemon.name}</h2>
<img src="${enemyPokemon.src}" width="200">
<p>HP ${enemyPokemon.hp}/${enemyPokemon.maxHp}</p>
<div class="bar"><div class="fill" style="width:${(enemyPokemon.hp/enemyPokemon.maxHp)*100}%"></div></div>
</div>

</div>

<div style="margin-top:40px;display:flex;flex-wrap:wrap;justify-content:center;">
${player.moves.map((m,i)=>`<button class="move-btn" onclick="useMove(${i})">${m.name}</button>`).join('')}
</div>

<div style="text-align:center;margin-top:20px;">
<button class="auth-btn" onclick="throwPokeball()">⚪ Lanzar Poké Ball</button>
<button class="auth-btn" onclick="closeCombat()">🏃 Huir</button>
</div>
`;

const combat=document.getElementById('combat-window');
combat.innerHTML=html;
combat.style.display='block';
}

function closeCombat(){
document.getElementById('combat-window').style.display='none';
}

function calculateDamage(attacker,defender,move){

let atk=move.category==='physical' ? attacker.attack : attacker.spAttack;
let def=move.category==='physical' ? defender.defense : defender.spDefense;

let damage=Math.floor((((2*attacker.level/5)+2)*move.power*atk/def)/50)+2;

if(Math.random()<0.1) damage*=2;

return damage;
}

function useMove(index){

const player=currentUser.team[0];
const move=player.moves[index];

const dmg=calculateDamage(player,enemyPokemon,move);

enemyPokemon.hp-=dmg;

if(move.heal){
player.hp+=10;
if(player.hp>player.maxHp) player.hp=player.maxHp;
}

if(enemyPokemon.hp<=0){
enemyPokemon.hp=0;
alert('¡Ganaste el combate!');
gainExp(player,50);
closeCombat();
renderUI();
return;
}

setTimeout(enemyAttack,800);
openCombat();
}

function enemyAttack(){

const player=currentUser.team[0];

const move=enemyPokemon.moves[0];

const dmg=calculateDamage(enemyPokemon,player,move);

player.hp-=dmg;

if(player.hp<=0){
player.hp=0;
alert('Tu Pokémon se debilitó');
closeCombat();
renderUI();
return;
}

openCombat();
}

function throwPokeball(){

if(currentUser.inventory.pokeball<=0){
alert('No tienes Poké Balls');
return;
}

currentUser.inventory.pokeball--;

let chance=0.3;

if(enemyPokemon.rarity==='rare') chance=0.15;
if(enemyPokemon.rarity==='legendary') chance=0.02;

if(enemyPokemon.hp<enemyPokemon.maxHp/3){
chance+=0.2;
}

if(Math.random()<chance){
alert('¡Pokémon capturado!');
currentUser.team.push(enemyPokemon);
currentUser.dailyCaptures++;
save();
renderUI();
closeCombat();
}else{
alert('El Pokémon escapó');
setTimeout(enemyAttack,500);
}
}

function gainExp(pokemon,amount){

pokemon.exp+=amount;

while(pokemon.exp>=pokemon.maxExp){

pokemon.exp-=pokemon.maxExp;
pokemon.level++;

if(pokemon.level>100){
pokemon.level=100;
return;
}

pokemon.maxExp=Math.floor(pokemon.maxExp*1.2);

pokemon.maxHp+=5;
pokemon.attack+=2;
pokemon.defense+=2;
pokemon.spAttack+=2;
pokemon.spDefense+=2;
pokemon.speed+=1;
pokemon.hp=pokemon.maxHp;

checkEvolution(pokemon);

alert(`${pokemon.name} subió a nivel ${pokemon.level}`);
}
}

function checkEvolution(pokemon){

const evo=EVOLUTIONS[pokemon.id];

if(!evo) return;

if(pokemon.level>=evo.level){

pokemon.id=evo.to;
pokemon.src=getSpr(evo.to);

alert('¡Tu Pokémon evolucionó!');
}
}

function addFriend(){

const val=document.getElementById('friend-input').value;

if(!val) return;

if(!currentUser.friends.includes(val)){
currentUser.friends.push(val);
}

save();
renderFriends();

document.getElementById('friend-input').value='';
}

function renderFriends(){

if(!currentUser) return;

const box=document.getElementById('friends-list');

if(!box) return;

if(currentUser.friends.length===0){
box.innerHTML='<p style="opacity:.7;">No tienes amigos añadidos.</p>';
return;
}

box.innerHTML=currentUser.friends.map(f=>`
<div class="friend-card">
🧑‍🤝‍🧑 ${f}
</div>
`).join('');
}

function getCapturedCount(){

const dex=JSON.parse(localStorage.getItem('fullDex')||'[]');

return dex.filter(p=>p.captured).length;
}

window.onload=()=>{

const saveData=localStorage.getItem('pokemonUser');

if(saveData){
currentUser=JSON.parse(saveData);
document.getElementById('register-modal').classList.remove('open');
renderUI();
}

};



// =========================
// SISTEMA TIPOS POKÉMON
// =========================

const TYPE_CHART={
fire:{grass:2,water:0.5,fire:0.5},
water:{fire:2,grass:0.5,water:0.5},
grass:{water:2,fire:0.5,grass:0.5},
electric:{water:2,grass:0.5,electric:0.5},
normal:{rock:0.5,ghost:0},
ground:{electric:2,fire:2},
psychic:{fighting:2,poison:2},
poison:{grass:2},
rock:{fire:2,flying:2},
ice:{dragon:2,grass:2},
dragon:{dragon:2}
};

function getTypeMultiplier(moveType,targetTypes){
let multi=1;

if(!targetTypes) return 1;

for(let t of targetTypes){
if(TYPE_CHART[moveType] && TYPE_CHART[moveType][t]){
multi*=TYPE_CHART[moveType][t];
}
}

return multi;
}

// =========================
// HABILIDADES
// =========================

const ABILITIES={
blaze:{name:'Mar Llamas',effect:'boost_fire'},
torrent:{name:'Torrente',effect:'boost_water'},
overgrow:{name:'Espesura',effect:'boost_grass'},
static:{name:'Electricidad Estática',effect:'paralyze_contact'}
};

// =========================
// CLIMA
// =========================

let WEATHER='clear';

function setWeather(weather){
WEATHER=weather;
alert('El clima cambió a '+weather);
}

function applyWeatherBonus(move){
let bonus=1;

if(WEATHER==='rain'){
if(move.type==='water') bonus=1.5;
if(move.type==='fire') bonus=0.5;
}

if(WEATHER==='sun'){
if(move.type==='fire') bonus=1.5;
if(move.type==='water') bonus=0.5;
}

return bonus;
}

// =========================
// IA AVANZADA
// =========================

function enemyChooseMove(enemy,player){

let bestMove=enemy.moves[0];
let bestDamage=0;

for(let move of enemy.moves){

let mult=getTypeMultiplier(move.type||'normal',player.types||['normal']);
let dmg=(move.power||40)*mult;

if(dmg>bestDamage){
bestDamage=dmg;
bestMove=move;
}
}

return bestMove;
}

// =========================
// POKEDEX GLOBAL
// =========================

const FULL_POKEDEX=[];

for(let i=1;i<=1025;i++){
FULL_POKEDEX.push({
id:i,
seen:false,
captured:false
});
}

function registerCaughtPokemon(id){

let dex=JSON.parse(localStorage.getItem('fullDex')||'[]');

if(dex.length===0){

dex=FULL_POKEDEX;
}

const entry=dex.find(p=>p.id===id);

if(entry){
entry.seen=true;
entry.captured=true;
}

localStorage.setItem('fullDex',JSON.stringify(dex));
}

function openPokedex(){

let dex=JSON.parse(localStorage.getItem('fullDex')||'[]');

if(dex.length===0){
dex=FULL_POKEDEX;
}

let html=`
<div class="modal-overlay open" id="pokedex-modal">
<div class="modal" style="width:1200px;max-width:98vw;">
<h1 style="color:#f5c842;">📖 POKÉDEX</h1>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-height:80vh;overflow:auto;">
`;

for(let p of dex){

html+=`
<div style="background:#111a44;border:2px solid #2244aa;padding:10px;border-radius:10px;text-align:center;">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" style="width:80px;image-rendering:pixelated;">
<div>#${p.id}</div>
<div>${p.captured?'CAPTURADO':'---'}</div>
</div>
`;
}

html+=`</div>
<button class="auth-btn" onclick="closePokedex()">Cerrar</button>
</div>
</div>`;

const div=document.createElement('div');
div.innerHTML=html;

// =========================
// REGISTRAR CAPTURA
// =========================

const originalThrowPokeball=throwPokeball;

throwPokeball=function(){

if(currentUser.inventory.pokeball<=0){
alert('No tienes Poké Balls');
return;
}

currentUser.inventory.pokeball--;

let chance=0.3;

if(enemyPokemon.rarity==='rare') chance=0.15;
if(enemyPokemon.rarity==='legendary') chance=0.02;

if(enemyPokemon.hp<enemyPokemon.maxHp/3){
chance+=0.2;
}

if(Math.random()<chance){

alert('¡Pokémon capturado!');

currentUser.team.push(enemyPokemon);

registerCaughtPokemon(enemyPokemon.id);

currentUser.dailyCaptures++;

save();
renderUI();
closeCombat();

}else{
alert('El Pokémon escapó');
setTimeout(enemyAttack,500);
}
}

// =========================
// MAPA POKÉMON
// =========================

const MAP_ZONES=[
{name:'Bosque Verde',wild:['Pidgey','Caterpie','Pikachu']},
{name:'Monte Luna',wild:['Zubat','Geodude','Clefairy']},
{name:'Ruta Marina',wild:['Tentacool','Magikarp','Lapras']},
{name:'Volcán Rojo',wild:['Slugma','Growlithe','Charmander']}
];

let CURRENT_ZONE=MAP_ZONES[0];

function openMap(){

let html=`
<div class="modal-overlay open" id="map-modal">
<div class="modal">
<h1>🗺️ MAPA POKÉMON</h1>
`;

MAP_ZONES.forEach((z,index)=>{
html+=`
<div class="card">
<h2>${z.name}</h2>
<p>${z.wild.join(', ')}</p>
<button class="auth-btn" onclick="travelTo(${index})">Viajar</button>
</div>`;
});

html+=`<button class="auth-btn" onclick="closeMap()">Cerrar</button></div></div>`;

const div=document.createElement('div');
div.innerHTML=html;
document.body.appendChild(div);
}

function closeMap(){
const el=document.getElementById('map-modal');
if(el) el.remove();
}

function travelTo(index){
CURRENT_ZONE=MAP_ZONES[index];
alert('Viajaste a '+CURRENT_ZONE.name);
closeMap();
}

});
